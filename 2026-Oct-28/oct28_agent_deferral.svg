<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Anthropic study: analysts followed a coin-flipped agent lean 86% of the time</title>
  <desc id="desc">Left panel: share of analyst choices matching the agent's secretly randomized lean, by decision: outcome measure 92 percent, weighting 90 percent, all four decisions 86 percent, comparison method 82 percent, farms covered 81 percent; a dashed line marks the 50 percent expected by chance. Right panel: among analysts with a prior preference, 60 percent switched when the agent disagreed versus 6 percent when it agreed; 77 percent reused the agent's arguments but only 15 percent credited the agent. Source: Anthropic, Oct 27 2026; 50 analysts, Claude Code with Claude Opus 4.8.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2937; }
    .muted { fill: #4b5563; }
    .card { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.2; }
    .old { fill: #9ca3af; }
    .new { fill: #2563eb; }
    .hd { fill: #111827; }
    .chance { stroke: #ea580c; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .chancet { fill: #c2410c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .card { fill: #1e293b; stroke: #334155; }
      .old { fill: #64748b; }
      .new { fill: #60a5fa; }
      .hd { fill: #f3f4f6; }
      .chance { stroke: #fb923c; }
      .chancet { fill: #fb923c; }
    }
    text { font-size: 13px; }
    .t { font-size: 18px; font-weight: 600; }
    .h { font-size: 15px; font-weight: 600; }
    .v { font-size: 13px; font-weight: 600; }
    .s { font-size: 12px; }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="400" rx="10"/>
  <text class="t hd" x="24" y="34">Analysts followed a coin-flipped agent lean on 86% of judgment calls (Anthropic, Oct 27)</text>
  <rect class="card" x="24" y="52" width="440" height="300" rx="8"/>
  <text class="h ink" x="44" y="80">Choices matching the agent's random lean</text>
  <text class="ink" x="44" y="125">Outcome measure</text>
  <rect class="new" x="190" y="110" width="202" height="22" rx="3"/>
  <text class="v ink" x="398" y="126">92%</text>
  <text class="ink" x="44" y="169">Weighting</text>
  <rect class="new" x="190" y="154" width="198" height="22" rx="3"/>
  <text class="v ink" x="394" y="170">90%</text>
  <text class="ink" x="44" y="213">All four (overall)</text>
  <rect class="new" x="190" y="198" width="189" height="22" rx="3"/>
  <text class="v ink" x="385" y="214">86%</text>
  <text class="ink" x="44" y="257">Comparison method</text>
  <rect class="new" x="190" y="242" width="180" height="22" rx="3"/>
  <text class="v ink" x="376" y="258">82%</text>
  <text class="ink" x="44" y="301">Farms covered</text>
  <rect class="new" x="190" y="286" width="178" height="22" rx="3"/>
  <text class="v ink" x="374" y="302">81%</text>
  <line class="chance" x1="300.0" y1="98" x2="300.0" y2="330"/>
  <text class="s chancet" x="300.0" y="344" text-anchor="middle">50% = no influence</text>
  <rect class="card" x="496" y="52" width="440" height="300" rx="8"/>
  <text class="h ink" x="516" y="80">Switching and attribution</text>
  <text class="ink" x="516" y="125">Switched when agent disagreed</text>
  <rect class="new" x="745" y="110" width="90" height="22" rx="3"/>
  <text class="v ink" x="841" y="126">60%</text>
  <text class="ink" x="516" y="175">Switched when agent agreed</text>
  <rect class="old" x="745" y="160" width="9" height="22" rx="3"/>
  <text class="v ink" x="760" y="176">6%</text>
  <text class="ink" x="516" y="243">Reused agent's arguments</text>
  <rect class="new" x="745" y="228" width="116" height="22" rx="3"/>
  <text class="v ink" x="867" y="244">77%</text>
  <text class="ink" x="516" y="293">Credited the agent</text>
  <rect class="old" x="745" y="278" width="23" height="22" rx="3"/>
  <text class="v ink" x="773" y="294">15%</text>
  <text class="s muted" x="516" y="226">Attribution (all 50 analysts)</text>
  <text class="s muted" x="516" y="98">Cases where the analyst already had a preference (n = 38)</text>
  <text class="s muted" x="24" y="376">Source: Anthropic, "How AI agents shape experts' judgment calls" (Oct 27 2026). 50 professional analysts, ~1 h task in Claude Code with</text>
  <text class="s muted" x="24" y="392">Claude Opus 4.8; agent leans assigned by hidden coin flip and deliberately strengthened, so real-world effects may be smaller.</text>
</svg>
