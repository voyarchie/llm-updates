<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d">
  <title id="t">CL-Bench 1.0 database task: mean reward without and with a persistent memory directory</title>
  <desc id="d">Paired horizontal bars for six Claude models. Opus 5.5: 0.655 to 0.838. Sonnet 5.5: 0.644 to 0.833. Opus 5: 0.564 to 0.828. Opus 4.7: 0.383 to 0.700. Sonnet 5: 0.306 to 0.610. Sonnet 4.6: 0.330 to 0.364, and 0.641 with memory plus refined instructions. Source: Anthropic, The components of agent memory, Nov 6 2026.</desc>
  <style>
    .bg{fill:#ffffff}
    .tx{fill:#1f2937;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .mut{fill:#4b5563}
    .grid{stroke:#d1d5db;stroke-width:1}
    .base{fill:#94a3b8}
    .mem{fill:#2563eb}
    .ins{fill:none;stroke:#d97706;stroke-width:2.5;stroke-dasharray:5 3}
    .insd{fill:#d97706}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0f172a}
      .tx{fill:#e5e7eb}
      .mut{fill:#9ca3af}
      .grid{stroke:#334155}
      .base{fill:#64748b}
      .mem{fill:#60a5fa}
      .ins{stroke:#fbbf24}
      .insd{fill:#fbbf24}
    }
  </style>
  <rect class="bg" x="0" y="0" width="760" height="430" rx="10"/>
  <text class="tx" x="24" y="34" font-size="18" font-weight="700">Memory helps newer models far more: CL-Bench 1.0 mean reward</text>
  <text class="tx mut" x="24" y="56" font-size="13">Fresh session each question; only a persistent memory directory carries over (Anthropic, Nov 6 2026)</text>

  <!-- axis: x from 150 (0.0) to 710 (1.0) => 560 px per 1.0 -->
  <g class="grid">
    <line x1="150" y1="78" x2="150" y2="366"/>
    <line x1="262" y1="78" x2="262" y2="366"/>
    <line x1="374" y1="78" x2="374" y2="366"/>
    <line x1="486" y1="78" x2="486" y2="366"/>
    <line x1="598" y1="78" x2="598" y2="366"/>
    <line x1="710" y1="78" x2="710" y2="366"/>
  </g>
  <g class="tx mut" font-size="11" text-anchor="middle">
    <text x="150" y="382">0</text><text x="262" y="382">0.2</text><text x="374" y="382">0.4</text>
    <text x="486" y="382">0.6</text><text x="598" y="382">0.8</text><text x="710" y="382">1.0</text>
  </g>

  <!-- rows: each 46 px, start y=86 -->
  <g font-size="13">
    <text class="tx" x="140" y="106" text-anchor="end" font-weight="600">Opus 5.5</text>
    <rect class="base" x="150" y="88" width="366.8" height="14" rx="2"/>
    <rect class="mem" x="150" y="104" width="469.3" height="14" rx="2"/>
    <text class="tx mut" x="522" y="99" font-size="11">0.655</text>
    <text class="tx" x="625" y="115" font-size="11" font-weight="600">0.838</text>

    <text class="tx" x="140" y="152" text-anchor="end" font-weight="600">Sonnet 5.5</text>
    <rect class="base" x="150" y="134" width="360.6" height="14" rx="2"/>
    <rect class="mem" x="150" y="150" width="466.5" height="14" rx="2"/>
    <text class="tx mut" x="516" y="145" font-size="11">0.644</text>
    <text class="tx" x="622" y="161" font-size="11" font-weight="600">0.833</text>

    <text class="tx" x="140" y="198" text-anchor="end" font-weight="600">Opus 5</text>
    <rect class="base" x="150" y="180" width="315.8" height="14" rx="2"/>
    <rect class="mem" x="150" y="196" width="463.7" height="14" rx="2"/>
    <text class="tx mut" x="471" y="191" font-size="11">0.564</text>
    <text class="tx" x="619" y="207" font-size="11" font-weight="600">0.828</text>

    <text class="tx" x="140" y="244" text-anchor="end" font-weight="600">Opus 4.7</text>
    <rect class="base" x="150" y="226" width="214.5" height="14" rx="2"/>
    <rect class="mem" x="150" y="242" width="392" height="14" rx="2"/>
    <text class="tx mut" x="370" y="237" font-size="11">0.383</text>
    <text class="tx" x="548" y="253" font-size="11" font-weight="600">0.700</text>

    <text class="tx" x="140" y="290" text-anchor="end" font-weight="600">Sonnet 5</text>
    <rect class="base" x="150" y="272" width="171.4" height="14" rx="2"/>
    <rect class="mem" x="150" y="288" width="341.6" height="14" rx="2"/>
    <text class="tx mut" x="327" y="283" font-size="11">0.306</text>
    <text class="tx" x="497" y="299" font-size="11" font-weight="600">0.610</text>

    <text class="tx" x="140" y="336" text-anchor="end" font-weight="600">Sonnet 4.6</text>
    <rect class="base" x="150" y="318" width="184.8" height="14" rx="2"/>
    <rect class="mem" x="150" y="334" width="203.8" height="14" rx="2"/>
    <rect class="ins" x="150" y="334" width="359" height="14" rx="2"/>
    <text class="tx mut" x="340" y="329" font-size="11">0.330</text>
    <text class="tx" x="360" y="345" font-size="11" font-weight="600">0.364</text>
    <text class="tx" x="515" y="345" font-size="11" font-weight="600">0.641 with refined instructions</text>
  </g>

  <!-- legend -->
  <g font-size="12">
    <rect class="base" x="24" y="398" width="14" height="12" rx="2"/>
    <text class="tx" x="44" y="409">Stateless baseline</text>
    <rect class="mem" x="170" y="398" width="14" height="12" rx="2"/>
    <text class="tx" x="190" y="409">With memory directory</text>
    <rect class="ins" x="350" y="398" width="14" height="12" rx="2"/>
    <text class="tx" x="370" y="409">Memory + "read memory first, test theories" prompt</text>
  </g>
</svg>
