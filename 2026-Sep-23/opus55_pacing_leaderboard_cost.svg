<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Claude Opus 5.5 opens a five point lead on the Artificial Analysis Intelligence Index v4.3 ten days after Anthropic called for pacing the frontier, while every lab that shipped competed on cost</title>
  <desc id="desc">Horizontal bar chart of Artificial Analysis Intelligence Index v4.3 scores as of September 23, 2026. Claude Opus 5.5, released September 22, scores 58 and leads alone, five points ahead of Claude Fable 5.1 and GPT-6 Astra, tied at 53. Then Claude Opus 5 at 51, GPT-6 Sol (new, September 22) at 48, GPT-5.6 Sol at 47, Grok 4.7 (new, September 21) at 46, Xiaomi MiMo-V2.6-Pro (new, September 22, MIT open weights) at 46 as the top open model, GLM-5.3 and Kimi K3 at 44, and GPT-6 Luna (new) at 37. Where Artificial Analysis published it, the cost to run one Index task is annotated: Opus 5.5 5.98 dollars, Fable 5.1 7.63, Astra 3.26, Opus 5 5.86, GPT-6 Sol 1.06, GPT-5.6 Sol 1.99, GPT-6 Luna 0.07. New models this window carry an amber outline. A side panel explains how Opus 5.5 kept cost per task flat: it uses about 119 thousand output tokens per task against 73 thousand for Opus 5, which alone would raise cost from 5.86 to 10.51 dollars; the 20 percent list-price cut brings that to 8.41, and the cache-read cut from 50 to 20 cents per million brings it to 5.98. So Anthropic matched on cost by cutting price while emitting more visible reasoning, not fewer tokens, which is the opposite route from GPT-6 Astra's latent recurrent depth. A footer tracks the open versus closed gap on the Index: 6 points on v4.1.1 at the start of September, 9 on v4.3 on September 20, and 12 now, 58 against 46, even though the top open model improved by two points.</desc>
