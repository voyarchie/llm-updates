  <text x="656" y="232" class="pt">Cost per task, step by step (AA):</text>
  <text x="656" y="254" class="pt">Opus 5 baseline</text><text x="900" y="254" class="pt" text-anchor="end">$5.86</text>
  <text x="656" y="274" class="pt">+ Opus 5.5 token usage</text><text x="900" y="274" class="pt" text-anchor="end">$10.51</text>
