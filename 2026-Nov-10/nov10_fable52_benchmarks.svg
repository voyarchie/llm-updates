<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 738" width="820" height="738" role="img" aria-labelledby="t d">
<title id="t">Claude Fable 5.2 launch benchmarks versus Fable 5.1, Opus 5.5 and the best listed rival</title>
<desc id="d">Grouped horizontal bars, percent. FrontierCode 2.0: Fable 5.2 49.1, Opus 5.5 45.5, best rival GPT-6 Astra 42.8, Fable 5.1 32.4; FrontierSWE v2: Fable 5.2 69.9, Opus 5.5 62.3, best rival GPT-6 Astra 65.5, Fable 5.1 56.3; AutomationBench: Fable 5.2 51.4, Opus 5.5 42.5, best rival Gemini 4 Carbon 53.9, Fable 5.1 31.4; Terminal-Bench-Science 0.1: Fable 5.2 74.6, Opus 5.5 58.7, best rival GPT-6 Astra 68.1, Fable 5.1 52.6; OSWorld 2.1 (offline, partial): Fable 5.2 89.3, Opus 5.5 87.2, best rival Gemini 4 Carbon 81.5, Fable 5.1 83.5; RoboDojo Sim (internal): Fable 5.2 64.9, Opus 5.5 39.4, best rival GPT-6 Astra 29.8, Fable 5.1 27.6; Remote Labor Index: Fable 5.2 41.3, Opus 5.5 21.3, best rival GPT-6 Astra 20.8, Fable 5.1 17.9; Humanity's Last Exam (tools): Fable 5.2 74.2, Opus 5.5 67.7, best rival GPT-6 Astra 57.2, Fable 5.1 65.6; Chartography (no tools): Fable 5.2 73.4, Opus 5.5 64.4, best rival Gemini 4 Carbon 72.5, Fable 5.1 44.8. Source: Anthropic launch post, Nov 9 2026; vendor-reported.</desc>
