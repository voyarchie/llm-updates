<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Anthropic quarterly revenue in 2026, from the amended S-1 filed November 2 2026</title>
  <desc id="desc">Vertical bar chart. Q1 2026 about 4.7 billion dollars, Q2 about 11.5 billion, Q3 about 17.0 billion (16.96 reported). Growth quarter over quarter: plus 132 percent in Q1, plus 144 percent in Q2, plus 47 percent in Q3. Q1 and Q2 are derived from the reported nine-month total of 33.24 billion and the reported growth rates. Q3 net loss 23.3 billion, mostly non-cash; operating loss about 0.57 billion; purchase and lease commitments 895.4 billion.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2937; }
    .muted { fill: #4b5563; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    .bar { fill: #93c5fd; }
    .bar3 { fill: #2563eb; }
    .up { fill: #047857; }
    .slow { fill: #b45309; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .grid { stroke: #334155; }
      .axis { stroke: #64748b; }
      .bar { fill: #1e40af; }
      .bar3 { fill: #60a5fa; }
      .up { fill: #34d399; }
      .slow { fill: #fbbf24; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="760" height="396" rx="8"/>
  <text class="ink" x="24" y="34" font-size="18" font-weight="700">Anthropic revenue: still growing fast, but growth slowed to +47% in Q3</text>
  <text class="muted" x="24" y="56" font-size="13">Quarterly revenue, US$ billions · amended S-1 (S-1/A), filed Nov 2 2026</text>

  <!-- y axis: y=300 is 0, 12px per $1B, top gridline 20B at y=60 -->
  <line class="grid" x1="90" y1="120" x2="540" y2="120"/>
  <line class="grid" x1="90" y1="180" x2="540" y2="180"/>
  <line class="grid" x1="90" y1="240" x2="540" y2="240"/>
  <line class="axis" x1="90" y1="300" x2="540" y2="300"/>
  <text class="muted" x="80" y="124" font-size="12" text-anchor="end">$15B</text>
  <text class="muted" x="80" y="184" font-size="12" text-anchor="end">$10B</text>
  <text class="muted" x="80" y="244" font-size="12" text-anchor="end">$5B</text>
  <text class="muted" x="80" y="304" font-size="12" text-anchor="end">0</text>

  <!-- Q1 4.73 -> h=56.8 -->
  <rect class="bar" x="125" y="243.2" width="90" height="56.8" rx="3"/>
  <text class="ink" x="170" y="236" font-size="14" font-weight="700" text-anchor="middle">~$4.7B</text>
  <text class="up" x="170" y="218" font-size="12" text-anchor="middle">+132% QoQ</text>
  <text class="ink" x="170" y="320" font-size="13" text-anchor="middle">Q1 2026</text>
  <text class="muted" x="170" y="336" font-size="11" text-anchor="middle">derived</text>

  <!-- Q2 11.55 -> h=138.6 -->
  <rect class="bar" x="270" y="161.4" width="90" height="138.6" rx="3"/>
  <text class="ink" x="315" y="154" font-size="14" font-weight="700" text-anchor="middle">~$11.5B</text>
  <text class="up" x="315" y="136" font-size="12" text-anchor="middle">+144% QoQ</text>
  <text class="ink" x="315" y="320" font-size="13" text-anchor="middle">Q2 2026</text>
  <text class="muted" x="315" y="336" font-size="11" text-anchor="middle">derived</text>

  <!-- Q3 16.96 -> h=203.5 -->
  <rect class="bar3" x="415" y="96.5" width="90" height="203.5" rx="3"/>
  <text class="ink" x="460" y="89" font-size="14" font-weight="700" text-anchor="middle">$16.96B</text>
  <text class="slow" x="460" y="71" font-size="12" font-weight="700" text-anchor="middle">+47% QoQ</text>
  <text class="ink" x="460" y="320" font-size="13" text-anchor="middle">Q3 2026</text>
  <text class="muted" x="460" y="336" font-size="11" text-anchor="middle">reported</text>

  <!-- side panel -->
  <text class="ink" x="565" y="96" font-size="13" font-weight="700">Q3 2026, other lines</text>
  <text class="muted" x="565" y="120" font-size="12">Net loss: $23.3B</text>
  <text class="muted" x="565" y="137" font-size="11">(mostly fair-value changes)</text>
  <text class="muted" x="565" y="160" font-size="12">Operating loss: ~$0.57B</text>
  <text class="muted" x="565" y="177" font-size="11">(Q2: ~$0.97B profit)</text>
  <text class="muted" x="565" y="200" font-size="12">Adj. op. margin: 19% → 15%</text>
  <text class="ink" x="565" y="228" font-size="12" font-weight="700">Commitments: $895.4B</text>
  <text class="muted" x="565" y="245" font-size="11">~$447.5B due before end-2030</text>
  <text class="muted" x="565" y="268" font-size="12">9-month revenue: $33.24B</text>

  <text class="muted" x="24" y="362" font-size="11">Q1/Q2 derived from the reported $33.24B nine-month total and growth rates (consistent with the original S-1's $16.29B H1).</text>
  <text class="muted" x="24" y="380" font-size="11">Source: Anthropic S-1/A (Nov 2 2026) via CNBC, Quartz and Shattered; not read from EDGAR directly.</text>
</svg>
