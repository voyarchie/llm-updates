<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Open-weight mixture-of-experts models: total vs active parameters, November 2026</title>
  <desc id="desc">Horizontal bar chart on a linear scale from 0 to 2.8 trillion parameters. Each bar shows total parameters with the active-per-token parameters as a darker segment at the left. Kimi K3.1 Pro (Moonshot, weights Nov 4): 2.8 trillion total, 104 billion active, 3.7 percent. Mistral Large 4 (Oct 29): 1.05 trillion total, 52 billion active, 5.0 percent. Tencent Hy4 (official Nov 4, weights pending): 770 billion total, 49 billion active in the August preview, 6.4 percent. Thinking Machines Inkling-Small (Jul 30): 276 billion total, 12 billion active, 4.3 percent. All four activate between about 4 and 6 percent of their weights per token.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2937; }
    .muted { fill: #4b5563; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .tot { fill: #c7d2fe; }
    .act { fill: #4338ca; }
    .hl { fill: #fde68a; }
    .hla { fill: #b45309; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .grid { stroke: #334155; }
      .tot { fill: #3730a3; }
      .act { fill: #a5b4fc; }
      .hl { fill: #92400e; }
      .hla { fill: #fcd34d; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="760" height="360" rx="8"/>
  <text class="ink" x="24" y="34" font-size="18" font-weight="700">Open weights got bigger; the active slice stayed ~4–6%</text>
  <text class="muted" x="24" y="56" font-size="13">Total parameters (light bar) and active parameters per token (dark segment), linear scale</text>

  <!-- x axis: 200..700 = 0..2800B (0.17857 px per B) -->
  <line class="grid" x1="200" y1="76" x2="200" y2="290"/>
  <line class="grid" x1="325" y1="76" x2="325" y2="290"/>
  <line class="grid" x1="450" y1="76" x2="450" y2="290"/>
  <line class="grid" x1="575" y1="76" x2="575" y2="290"/>
  <line class="grid" x1="700" y1="76" x2="700" y2="290"/>
  <text class="muted" x="200" y="308" font-size="12" text-anchor="middle">0</text>
  <text class="muted" x="325" y="308" font-size="12" text-anchor="middle">0.7T</text>
  <text class="muted" x="450" y="308" font-size="12" text-anchor="middle">1.4T</text>
  <text class="muted" x="575" y="308" font-size="12" text-anchor="middle">2.1T</text>
  <text class="muted" x="700" y="308" font-size="12" text-anchor="middle">2.8T</text>

  <!-- Kimi K3.1 Pro -->
  <text class="ink" x="188" y="100" font-size="14" font-weight="700" text-anchor="end">Kimi K3.1 Pro</text>
  <text class="muted" x="188" y="116" font-size="11" text-anchor="end">Moonshot · weights Nov 4</text>
  <rect class="hl" x="200" y="88" width="500" height="30" rx="3"/>
  <rect class="hla" x="200" y="88" width="18.6" height="30" rx="3"/>
  <text class="ink" x="226" y="108" font-size="13">2.8T total · 104B active (3.7%)</text>

  <!-- Mistral Large 4 -->
  <text class="ink" x="188" y="152" font-size="14" text-anchor="end">Mistral Large 4</text>
  <text class="muted" x="188" y="168" font-size="11" text-anchor="end">Mistral · Oct 29</text>
  <rect class="tot" x="200" y="140" width="187.5" height="30" rx="3"/>
  <rect class="act" x="200" y="140" width="9.3" height="30" rx="3"/>
  <text class="ink" x="396" y="160" font-size="13">1.05T · 52B (5.0%)</text>

  <!-- Hy4 -->
  <text class="ink" x="188" y="204" font-size="14" font-weight="700" text-anchor="end">Tencent Hy4</text>
  <text class="muted" x="188" y="220" font-size="11" text-anchor="end">official Nov 4 · weights pending</text>
  <rect class="hl" x="200" y="192" width="137.5" height="30" rx="3"/>
  <rect class="hla" x="200" y="192" width="8.75" height="30" rx="3"/>
  <text class="ink" x="346" y="212" font-size="13">770B · 49B* (6.4%)</text>

  <!-- Inkling-Small -->
  <text class="ink" x="188" y="256" font-size="14" text-anchor="end">Inkling-Small</text>
  <text class="muted" x="188" y="272" font-size="11" text-anchor="end">Thinking Machines · Jul 30</text>
  <rect class="tot" x="200" y="244" width="49.3" height="30" rx="3"/>
  <rect class="act" x="200" y="244" width="2.4" height="30" rx="3"/>
  <text class="ink" x="258" y="264" font-size="13">276B · 12B (4.3%)</text>

  <text class="muted" x="24" y="334" font-size="11">Highlighted = new this brief. *Hy4 active count is the August preview figure; Tencent has not restated it for the official model.</text>
  <text class="muted" x="24" y="350" font-size="11">Sources: Moonshot / Hugging Face coverage; Mistral; Tencent via Caixin, Gigazine; Thinking Machines model card. Vendor-reported figures.</text>
</svg>
