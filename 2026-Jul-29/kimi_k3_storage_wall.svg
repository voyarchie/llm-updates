<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Horizontal bar chart of storage and video-memory footprint in gigabytes for the Kimi K3 open-weights release as of July 28 2026. To serve the full model in vLLM needs about 1,680 gigabytes of video memory. The Hugging Face repository in native MXFP4 4-bit is about 1,560 gigabytes. The smallest usable community quantization is still about 540 gigabytes. For reference, a single Nvidia H100 accelerator holds 80 gigabytes and a high-end consumer GPU holds 24 gigabytes. The chart's point is that because Kimi K3 ships quantization-aware in 4-bit, there is no compression dividend left, so even the smallest build needs roughly seven 80-gigabyte H100s and the full model needs about twenty-one — it is a datacenter-class model, not consumer-runnable.">
  <title>Kimi K3's weights are open — but loading them takes a datacenter</title>

  <!-- theme-neutral palette: slate text/axes read on light and dark; saturated bars carry their own labels -->
  <text x="24" y="30" font-size="19" font-weight="700" fill="#64748b">Kimi K3's weights are open — but loading them takes a datacenter</text>
  <text x="24" y="50" font-size="12.5" fill="#94a3b8">Footprint in gigabytes. Shipped quantization-aware in 4-bit (MXFP4), so there is no compression dividend left to spend.</text>

  <!-- X axis baseline at y=330, plot from x=250 to x=832 for 0..1800 GB  (scale 0.32333 px/GB) -->
  <line x1="250" y1="86" x2="250" y2="330" stroke="#94a3b8" stroke-width="1"/>
  <line x1="250" y1="330" x2="832" y2="330" stroke="#94a3b8" stroke-width="1"/>

  <!-- X gridlines & ticks: 0,400,800,1200,1600 GB -> x 250,379.3,508.7,638,767.3 -->
  <line x1="379.3" y1="86" x2="379.3" y2="330" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="508.7" y1="86" x2="508.7" y2="330" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="638"   y1="86" x2="638"   y2="330" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="767.3" y1="86" x2="767.3" y2="330" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="250"   y="346" font-size="10.5" fill="#94a3b8" text-anchor="middle">0</text>
  <text x="379.3" y="346" font-size="10.5" fill="#94a3b8" text-anchor="middle">400</text>
  <text x="508.7" y="346" font-size="10.5" fill="#94a3b8" text-anchor="middle">800</text>
  <text x="638"   y="346" font-size="10.5" fill="#94a3b8" text-anchor="middle">1,200</text>
  <text x="767.3" y="346" font-size="10.5" fill="#94a3b8" text-anchor="middle">1,600</text>
  <text x="541" y="365" font-size="11" fill="#94a3b8" text-anchor="middle">Gigabytes (GB)</text>

  <!-- Row 1: Serve full (VRAM) 1680 GB -> width 543.2 -->
  <text x="242" y="107" font-size="12" fill="#64748b" text-anchor="end" font-weight="600">Serve full model (vLLM VRAM)</text>
  <rect x="250" y="94" width="543.2" height="26" rx="3" fill="#b91c1c"/>
  <text x="787" y="111" font-size="11.5" fill="#ffffff" text-anchor="end" font-weight="700">~1,680 GB</text>

  <!-- Row 2: HF repo native MXFP4 1560 GB -> width 504.4 -->
  <text x="242" y="152" font-size="12" fill="#64748b" text-anchor="end" font-weight="600">HF repo, native MXFP4 (4-bit)</text>
  <rect x="250" y="139" width="504.4" height="26" rx="3" fill="#dc2626"/>
  <text x="748" y="156" font-size="11.5" fill="#ffffff" text-anchor="end" font-weight="700">~1,560 GB</text>

  <!-- Row 3: Smallest usable quant 540 GB -> width 174.6 -->
  <text x="242" y="197" font-size="12" fill="#64748b" text-anchor="end" font-weight="600">Smallest usable quant (~1-bit)</text>
  <rect x="250" y="184" width="174.6" height="26" rx="3" fill="#d97706"/>
  <text x="432" y="201" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="700">~540 GB</text>

  <!-- Row 4: 1x H100 80 GB -> width 25.9 -->
  <text x="242" y="242" font-size="12" fill="#64748b" text-anchor="end" font-weight="600">1× Nvidia H100</text>
  <rect x="250" y="229" width="25.9" height="26" rx="3" fill="#0d9488"/>
  <text x="283" y="246" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="700">80 GB</text>

  <!-- Row 5: consumer GPU 24 GB -> width 7.8 -->
  <text x="242" y="287" font-size="12" fill="#64748b" text-anchor="end" font-weight="600">High-end consumer GPU</text>
  <rect x="250" y="274" width="7.8" height="26" rx="3" fill="#0891b2"/>
  <text x="265" y="291" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="700">24 GB</text>

  <!-- annotation -->
  <text x="250" y="322" font-size="11" fill="#94a3b8">Even the smallest build ≈ 7× an 80 GB H100; the full model ≈ 21×. Datacenter-class, not consumer-runnable.</text>
</svg>
