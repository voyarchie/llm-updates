<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Gemini 4 Argon: from gated preview to general availability (Sep 30 to Dec 1, 2026)</title>
  <desc id="desc">A timeline with three milestones. September 30: announced and released only to the Fairwind Program, without cyber guardrails, for vetted government, critical-infrastructure and security partners. October 13: general availability as gemini-4-argon on the Gemini API, AI Studio, Gemini Enterprise and Google Cloud, in the Gemini app for AI Pro and Ultra, and in Antigravity for Ultra and eligible Enterprise only; the public model blocks offensive cyber tasks while Fairwind keeps the unguarded version. December 1: the introductory price of 2 dollars input and 10 dollars output per million tokens ends and becomes 4 and 20. Below, a strip of facts: a 1,048,576-token window shared by input, thinking and output; Artificial Analysis Intelligence Index 53, level with GPT-6 Astra, behind Opus 5.5 at 58; AA-Omniscience hallucination rate 15 percent; Google's own claims of first place on the Vals Index and Harvey's Legal Agent Benchmark and 0.7 percent attack success on Gray Swan indirect prompt injection.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2937; }
    .muted { fill: #4b5563; }
    .line { stroke: #9ca3af; }
    .card { fill: #f9fafb; stroke: #d1d5db; }
    .gate { fill: #f59e0b; }
    .ga { fill: #3b82f6; }
    .price { fill: #8b5cf6; }
    .gatecard { fill: #f59e0b1f; stroke: #f59e0b; }
    .gacard { fill: #3b82f61f; stroke: #3b82f6; }
    .pricecard { fill: #8b5cf61f; stroke: #8b5cf6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .line { stroke: #64748b; }
      .card { fill: #1e293b; stroke: #475569; }
      .gatecard { fill: #f59e0b26; }
      .gacard { fill: #3b82f62e; }
      .pricecard { fill: #8b5cf62e; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="470" rx="12"/>
  <text class="ink" x="32" y="40" font-size="21" font-weight="700">Gemini 4 Argon: gated preview → general availability</text>
  <text class="muted" x="32" y="64" font-size="14">Announced Sep 30 for cyber defenders only; opened to everyone paying on Oct 13 (watch-item #27 closed)</text>

  <!-- timeline -->
  <line class="line" x1="80" y1="112" x2="880" y2="112" stroke-width="3"/>
  <circle class="gate" cx="160" cy="112" r="11"/>
  <circle class="ga" cx="480" cy="112" r="11"/>
  <circle class="price" cx="800" cy="112" r="11"/>
  <text class="ink" x="160" y="94" font-size="15" font-weight="700" text-anchor="middle">Sep 30</text>
  <text class="ink" x="480" y="94" font-size="15" font-weight="700" text-anchor="middle">Oct 13</text>
  <text class="ink" x="800" y="94" font-size="15" font-weight="700" text-anchor="middle">Dec 1</text>

  <!-- cards -->
  <rect class="gatecard" x="32" y="138" width="270" height="170" rx="10" stroke-width="1.5"/>
  <text class="ink" x="48" y="164" font-size="15" font-weight="700">Fairwind only</text>
  <text class="ink" x="48" y="190" font-size="13">Vetted government, critical-</text>
  <text class="ink" x="48" y="208" font-size="13">infrastructure and security</text>
  <text class="ink" x="48" y="226" font-size="13">partners</text>
  <text class="ink" x="48" y="252" font-size="13">Shipped <tspan font-weight="700">without cyber guardrails</tspan></text>
  <text class="muted" x="48" y="278" font-size="12">Google: 12/12 simulated end-to-end</text>
  <text class="muted" x="48" y="294" font-size="12">attack scenarios (own evaluation)</text>

  <rect class="gacard" x="330" y="138" width="300" height="170" rx="10" stroke-width="1.5"/>
  <text class="ink" x="346" y="164" font-size="15" font-weight="700">General availability</text>
  <text class="ink" x="346" y="190" font-size="13"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">gemini-4-argon</tspan>: Gemini API,</text>
  <text class="ink" x="346" y="208" font-size="13">AI Studio, Google Cloud, Enterprise</text>
  <text class="ink" x="346" y="226" font-size="13">Gemini app: AI Pro and Ultra</text>
  <text class="ink" x="346" y="244" font-size="13">Antigravity: Ultra / eligible Enterprise</text>
  <text class="ink" x="346" y="270" font-size="13">Public model <tspan font-weight="700">blocks offensive cyber</tspan></text>
  <text class="muted" x="346" y="294" font-size="12">Fairwind keeps the unguarded variant</text>

  <rect class="pricecard" x="658" y="138" width="270" height="170" rx="10" stroke-width="1.5"/>
  <text class="ink" x="674" y="164" font-size="15" font-weight="700">Introductory price ends</text>
  <text class="ink" x="674" y="194" font-size="13">To Nov 30: <tspan font-weight="700">$2 / $10</tspan> per M tokens</text>
  <text class="ink" x="674" y="216" font-size="13">From Dec 1: <tspan font-weight="700">$4 / $20</tspan></text>
  <text class="ink" x="674" y="238" font-size="13">Cached input: 95% off</text>
  <text class="muted" x="674" y="270" font-size="12">AA cost per Index task: $1.99 now,</text>
  <text class="muted" x="674" y="286" font-size="12">about $3.98 at standard price</text>

  <!-- facts strip -->
  <rect class="card" x="32" y="330" width="896" height="112" rx="10" stroke-width="1"/>
  <text class="ink" x="48" y="356" font-size="14" font-weight="700">Independent</text>
  <text class="ink" x="48" y="380" font-size="13">AA Intelligence Index <tspan font-weight="700">53</tspan>: level with GPT-6 Astra, behind Opus 5.5 (58)</text>
  <text class="ink" x="48" y="402" font-size="13">AA-Omniscience hallucination rate <tspan font-weight="700">15%</tspan>, lowest among models scoring 45+</text>
  <text class="ink" x="48" y="424" font-size="13">Window: <tspan font-weight="700">1,048,576</tspan> tokens shared by input, thinking and output</text>
  <text class="ink" x="560" y="356" font-size="14" font-weight="700">Google's claims</text>
  <text class="ink" x="560" y="380" font-size="13">#1 on the Vals Index and Harvey LAB</text>
  <text class="ink" x="560" y="402" font-size="13">Gray Swan indirect injection: 0.7% success</text>
  <text class="ink" x="560" y="424" font-size="13">+35% agent code submissions in Antigravity</text>
</svg>
