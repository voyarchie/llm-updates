<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Frontier text models on the Artificial Analysis Intelligence Index after Sep 28 to Sep 30, 2026</title>
  <desc id="desc">Horizontal bar chart on a 0 to 60 scale. Claude Opus 5.5 58, unchanged, still sole number one. Claude Sonnet 5.5 56, new on September 28, priced 2 dollars input and 10 dollars output per million tokens. Gemini 4 Argon 53 (52.6 at High), new on September 30, introductory 2 and 10 dollars, initially limited to Google's Fairwind cyber-defender program. GPT-6 Astra 53, unchanged. Fable 5.1 53, unchanged. GPT-6.1 Sol 52, new on September 29, 2 and 10 dollars. GPT-6.1 Astra has no score: OpenAI shelved it on September 28 after it failed internal scope-and-authorization checks. Footer: three new models in three days, all at 2 dollars input and 10 dollars output, and none displaces Opus 5.5; the one model withheld was withheld for safety.</desc>
  <style>
    .hd{fill:#64748b;font-size:20px;font-weight:700}
    .sub{fill:#7c8aa0;font-size:12px}
    .nm{fill:#708098;font-size:13px;font-weight:700}
    .tg{font-size:11px;font-weight:700}
    .v{fill:#708098;font-size:13px;font-weight:700}
    .tx{fill:#7c8aa0;font-size:11px}
    .ax{fill:#7c8aa0;font-size:10.5px}
    .ft{fill:#708098;font-size:12.5px;font-weight:700}
    .fs{fill:#7c8aa0;font-size:11.5px}
    .r{fill:#dc2626}.a{fill:#d97706}.b{fill:#2563eb}.g{fill:#059669}.p{fill:#7c3aed}.s{fill:#7c8aa0}
  </style>

  <text x="30" y="36" class="hd">Three new models in three days; the top does not move</text>
  <text x="30" y="57" class="sub">Artificial Analysis Intelligence Index (v4.2), highest setting per model, as reported Sep 28 – Oct 1, 2026. Scale 0–60.</text>

  <!-- axis: x0=250 → 0 ; 10px per point ; 60 → 850 -->
  <g stroke="#7c8aa0" stroke-opacity="0.3" stroke-width="1">
    <line x1="250" y1="78" x2="250" y2="372"/>
    <line x1="450" y1="78" x2="450" y2="372" stroke-dasharray="3 4"/>
    <line x1="650" y1="78" x2="650" y2="372" stroke-dasharray="3 4"/>
    <line x1="850" y1="78" x2="850" y2="372" stroke-dasharray="3 4"/>
  </g>
  <text x="250" y="388" class="ax" text-anchor="middle">0</text>
  <text x="450" y="388" class="ax" text-anchor="middle">20</text>
  <text x="650" y="388" class="ax" text-anchor="middle">40</text>
  <text x="850" y="388" class="ax" text-anchor="middle">60</text>

  <!-- rows: y step 42 -->
  <text x="30" y="100" class="nm">Claude Opus 5.5</text>
  <text x="30" y="114" class="tx">Anthropic · Sep 22 · unchanged</text>
  <rect x="250" y="88" width="580" height="24" rx="4" class="p" fill-opacity="0.75"/>
  <text x="838" y="105" class="v">58</text>

  <text x="30" y="142" class="nm">Claude Sonnet 5.5</text>
  <text x="30" y="156" class="tx">Anthropic · Sep 28 · $2 / $10</text>
  <rect x="250" y="130" width="560" height="24" rx="4" class="p" fill-opacity="0.45"/>
  <text x="818" y="147" class="v">56</text>
  <text x="190" y="142" class="tg g" text-anchor="end">NEW</text>

  <text x="30" y="184" class="nm">Gemini 4 Argon</text>
  <text x="30" y="198" class="tx">Google · Sep 30 · $2 / $10 intro</text>
  <rect x="250" y="172" width="526" height="24" rx="4" class="b" fill-opacity="0.6"/>
  <text x="784" y="189" class="v">53</text>
  <text x="190" y="184" class="tg g" text-anchor="end">NEW</text>
  <text x="270" y="189" class="tg" fill="#ffffff">Fairwind cyber partners first</text>

  <text x="30" y="226" class="nm">GPT-6 Astra</text>
  <text x="30" y="240" class="tx">OpenAI · Sep 3 · unchanged</text>
  <rect x="250" y="214" width="530" height="24" rx="4" class="g" fill-opacity="0.6"/>
  <text x="788" y="231" class="v">53</text>

  <text x="30" y="268" class="nm">Claude Fable 5.1</text>
  <text x="30" y="282" class="tx">Anthropic · unchanged</text>
  <rect x="250" y="256" width="530" height="24" rx="4" class="p" fill-opacity="0.3"/>
  <text x="788" y="273" class="v">53</text>

  <text x="30" y="310" class="nm">GPT-6.1 Sol</text>
  <text x="30" y="324" class="tx">OpenAI · Sep 29 · $2 / $10</text>
  <rect x="250" y="298" width="520" height="24" rx="4" class="g" fill-opacity="0.4"/>
  <text x="778" y="315" class="v">52</text>
  <text x="190" y="310" class="tg g" text-anchor="end">NEW</text>

  <text x="30" y="352" class="nm">GPT-6.1 Astra</text>
  <text x="30" y="366" class="tx">OpenAI · planned for October</text>
  <rect x="250" y="340" width="600" height="24" rx="4" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="270" y="357" class="tg r">SHELVED Sep 28: "didn't quite meet the bar in terms of staying within scope and authorization"</text>

  <!-- footer -->
  <line x1="30" y1="405" x2="910" y2="405" stroke="#7c8aa0" stroke-opacity="0.35"/>
  <text x="30" y="428" class="ft">Price converges, capability doesn't: all three new models list at $2 in / $10 out per million tokens.</text>
  <text x="30" y="450" class="fs">Opus 5.5 keeps a ~5-point lead. The one model withheld this week was withheld for safety, not capability.</text>
  <text x="30" y="470" class="fs">Sources: Artificial Analysis, The Decoder, VentureBeat, MarkTechPost, The Register.</text>
</svg>
