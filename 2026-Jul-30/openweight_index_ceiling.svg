<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Horizontal bar chart of open-weight language models on the Artificial Analysis Intelligence Index as of July 30 2026. Kimi K3 leads open weights at 57, far ahead of GLM-5.2 at 51, DeepSeek V4 Pro at 44 and Inkling at 41. A dashed vertical reference line marks the closed-frontier ceiling at Claude Opus 5's 61 — four points above the best open model. Kimi K3 is the highest-scoring open model ever released, yet still sits below the closed number one.">
  <title>Kimi K3 tops open weights at Index 57 — but the closed ceiling (Opus 5, 61) is still four points higher</title>

  <!-- theme-neutral palette: slate text/axes read on light and dark; teal = Kimi K3 highlight, slate = other open models, blue dashed = closed ceiling -->
  <text x="24" y="30" font-size="19" font-weight="700" fill="#64748b">The open-weight ceiling rises to 57 — still under the closed frontier at 61</text>
  <text x="24" y="50" font-size="12.5" fill="#94a3b8">Artificial Analysis Intelligence Index v4.1 (max effort). Open-weight models only; dashed line = closed #1 (Opus 5).</text>

  <!-- X gridlines / ticks: Index 30..65, x = 200 + (v-30)*17.714 -->
  <line x1="288.6" y1="80" x2="288.6" y2="310" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="377.1" y1="80" x2="377.1" y2="310" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="465.7" y1="80" x2="465.7" y2="310" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="554.3" y1="80" x2="554.3" y2="310" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="642.9" y1="80" x2="642.9" y2="310" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="731.4" y1="80" x2="731.4" y2="310" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="820.0" y1="80" x2="820.0" y2="310" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="200"   y="328" font-size="10.5" fill="#94a3b8" text-anchor="middle">30</text>
  <text x="288.6" y="328" font-size="10.5" fill="#94a3b8" text-anchor="middle">35</text>
  <text x="377.1" y="328" font-size="10.5" fill="#94a3b8" text-anchor="middle">40</text>
  <text x="465.7" y="328" font-size="10.5" fill="#94a3b8" text-anchor="middle">45</text>
  <text x="554.3" y="328" font-size="10.5" fill="#94a3b8" text-anchor="middle">50</text>
  <text x="642.9" y="328" font-size="10.5" fill="#94a3b8" text-anchor="middle">55</text>
  <text x="731.4" y="328" font-size="10.5" fill="#94a3b8" text-anchor="middle">60</text>
  <text x="820.0" y="328" font-size="10.5" fill="#94a3b8" text-anchor="middle">65</text>
  <text x="510" y="348" font-size="11" fill="#94a3b8" text-anchor="middle">Artificial Analysis Intelligence Index (higher = smarter)</text>

  <!-- baseline axis -->
  <line x1="200" y1="80" x2="200" y2="310" stroke="#94a3b8" stroke-width="1"/>

  <!-- Kimi K3 = 57 (highlight) -->
  <rect x="200" y="95" width="478.3" height="30" fill="#0d9488"/>
  <text x="192" y="114" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="end">Kimi K3</text>
  <text x="188" y="127" font-size="9.5" fill="#94a3b8" text-anchor="end">2.8T · 104B active · CN · Modified MIT</text>
  <text x="688" y="115" font-size="12.5" font-weight="700" fill="#0d9488" text-anchor="start">57</text>

  <!-- GLM-5.2 = 51 -->
  <rect x="200" y="150" width="372.0" height="30" fill="#64748b"/>
  <text x="192" y="169" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="end">GLM-5.2</text>
  <text x="582" y="170" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">51</text>

  <!-- DeepSeek V4 Pro = 44 -->
  <rect x="200" y="205" width="248.0" height="30" fill="#64748b"/>
  <text x="192" y="224" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="end">DeepSeek V4 Pro</text>
  <text x="458" y="225" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">44</text>

  <!-- Inkling = 41 -->
  <rect x="200" y="260" width="194.9" height="30" fill="#64748b"/>
  <text x="192" y="279" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="end">Inkling</text>
  <text x="188" y="292" font-size="9.5" fill="#94a3b8" text-anchor="end">US · Apache-2.0</text>
  <text x="405" y="280" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">41</text>

  <!-- closed ceiling: Opus 5 = 61 -->
  <line x1="749.1" y1="80" x2="749.1" y2="310" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="749.1" y="74" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">closed #1 — Opus 5 · 61</text>

  <!-- gap annotation -->
  <text x="700" y="150" font-size="10.5" fill="#94a3b8" text-anchor="end">+4 to the closed ceiling</text>
</svg>
