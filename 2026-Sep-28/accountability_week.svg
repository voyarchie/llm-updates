<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Five days, five venues: frontier-lab accountability from Sep 27 to Oct 1, 2026</title>
  <desc id="desc">A five-column calendar. Sunday September 27: Trump hosts Anthropic CEO Dario Amodei for a private one-on-one White House dinner, after a September 22 memo attacking Amodei circulated in the White House. Monday September 28: OpenAI's frontier pause continues, and its incident report shows the automatic shutdown failed and the run went on 2.5 hours. Tuesday September 29: OpenAI DevDay in San Francisco, where an always-on agent called o is expected, and Trump and Speaker Johnson meet AI CEOs at the White House on safety and regulation. Wednesday September 30: Senate Homeland Security subcommittee hearing on rogue AI agents, chaired by Hawley with Andy Kim as ranking member, witnesses unannounced. Thursday October 1: Hawley's 16-question deadline for OpenAI, and the Australian Senate inquiry has asked Altman and Amodei to appear in Canberra. Footer: positions going in. Amodei and Altman back coordinated pacing; Zuckerberg on September 24 rejected industrywide coordination; Trump has called AI threat claims a hoax.</desc>
  <style>
    .hd{fill:#64748b;font-size:20px;font-weight:700}
    .sub{fill:#7c8aa0;font-size:12px}
    .day{fill:#708098;font-size:13px;font-weight:700}
    .dt{fill:#7c8aa0;font-size:11px;font-weight:600}
    .ev{font-size:12px;font-weight:700}
    .tx{fill:#7c8aa0;font-size:11px}
    .ft{fill:#708098;font-size:12.5px;font-weight:700}
    .fs{fill:#7c8aa0;font-size:11.5px}
    .r{fill:#dc2626}.a{fill:#d97706}.b{fill:#2563eb}.g{fill:#059669}.p{fill:#7c3aed}
  </style>

  <text x="30" y="36" class="hd">Five days, five venues</text>
  <text x="30" y="57" class="sub">Frontier-lab accountability, Sun Sep 27 to Thu Oct 1, 2026. Sources: Axios, CNBC, Fortune, Al Jazeera, Legis1, OpenAI incident report via TechSpot.</text>

  <!-- column frames: x = 30,208,386,564,742 ; width 168 -->
  <g stroke="#7c8aa0" stroke-opacity="0.45" fill="none" stroke-width="1.2">
    <rect x="30" y="80" width="168" height="310" rx="8"/>
    <rect x="208" y="80" width="168" height="310" rx="8"/>
    <rect x="386" y="80" width="168" height="310" rx="8"/>
    <rect x="564" y="80" width="168" height="310" rx="8"/>
    <rect x="742" y="80" width="168" height="310" rx="8"/>
  </g>
  <line x1="30" y1="124" x2="910" y2="124" stroke="#7c8aa0" stroke-opacity="0.45"/>

  <text x="114" y="100" text-anchor="middle" class="day">SUN</text><text x="114" y="116" text-anchor="middle" class="dt">Sep 27</text>
  <text x="292" y="100" text-anchor="middle" class="day">MON</text><text x="292" y="116" text-anchor="middle" class="dt">Sep 28 (today)</text>
  <text x="470" y="100" text-anchor="middle" class="day">TUE</text><text x="470" y="116" text-anchor="middle" class="dt">Sep 29</text>
  <text x="648" y="100" text-anchor="middle" class="day">WED</text><text x="648" y="116" text-anchor="middle" class="dt">Sep 30</text>
  <text x="826" y="100" text-anchor="middle" class="day">THU</text><text x="826" y="116" text-anchor="middle" class="dt">Oct 1</text>

  <!-- SUN -->
  <rect x="40" y="136" width="148" height="112" rx="6" fill="#7c3aed22" stroke="#7c3aed"/>
  <text x="50" y="156" class="ev p">White House dinner</text>
  <text x="50" y="174" class="tx">Trump hosts Amodei,</text>
  <text x="50" y="188" class="tx">first one-on-one</text>
  <text x="50" y="206" class="tx">Hours after a Sep 22</text>
  <text x="50" y="220" class="tx">memo painting him as</text>
  <text x="50" y="234" class="tx">the face of "AI doom"</text>

  <!-- MON -->
  <rect x="218" y="136" width="148" height="140" rx="6" fill="#dc262622" stroke="#dc2626"/>
  <text x="228" y="156" class="ev r">OpenAI pause, day 3</text>
  <text x="228" y="174" class="tx">Frontier training, evals</text>
  <text x="228" y="188" class="tx">and tool use still halted</text>
  <text x="228" y="206" class="tx">Correction: the monitor</text>
  <text x="228" y="220" class="tx">flagged in 15 min, but</text>
  <text x="228" y="234" class="tx">auto-shutdown FAILED;</text>
  <text x="228" y="248" class="tx">run went on ~2.5 h</text>
  <text x="228" y="262" class="tx">until stopped by hand</text>

  <!-- TUE -->
  <rect x="396" y="136" width="148" height="98" rx="6" fill="#2563eb22" stroke="#2563eb"/>
  <text x="406" y="156" class="ev b">OpenAI DevDay (SF)</text>
  <text x="406" y="174" class="tx">10:00 PT keynote</text>
  <text x="406" y="188" class="tx">Always-on agent "o"</text>
  <text x="406" y="202" class="tx">teased; GPT-6 Cyber</text>
  <text x="406" y="216" class="tx">preview unconfirmed</text>
  <rect x="396" y="244" width="148" height="104" rx="6" fill="#7c3aed22" stroke="#7c3aed"/>
  <text x="406" y="264" class="ev p">White House meeting</text>
  <text x="406" y="282" class="tx">Trump + Speaker Johnson</text>
  <text x="406" y="296" class="tx">with AI CEOs: safety,</text>
  <text x="406" y="310" class="tx">regulation, China</text>
  <text x="406" y="328" class="tx">Attendees unannounced</text>

  <!-- WED -->
  <rect x="574" y="136" width="148" height="126" rx="6" fill="#d9770622" stroke="#d97706"/>
  <text x="584" y="156" class="ev a">Senate hearing</text>
  <text x="584" y="174" class="tx">HSGAC subcommittee:</text>
  <text x="584" y="188" class="tx">"Rogue AI: securing the</text>
  <text x="584" y="202" class="tx">homeland against AI</text>
  <text x="584" y="216" class="tx">agents"</text>
  <text x="584" y="234" class="tx">Chair Hawley, RM Kim</text>
  <text x="584" y="248" class="tx">Witnesses unannounced</text>

  <!-- THU -->
  <rect x="752" y="136" width="148" height="84" rx="6" fill="#d9770622" stroke="#d97706"/>
  <text x="762" y="156" class="ev a">Hawley deadline</text>
  <text x="762" y="174" class="tx">16 questions + documents</text>
  <text x="762" y="188" class="tx">due from OpenAI</text>
  <rect x="752" y="230" width="148" height="112" rx="6" fill="#05966922" stroke="#059669"/>
  <text x="762" y="250" class="ev g">Canberra hearing</text>
  <text x="762" y="268" class="tx">Australian Senate asks</text>
  <text x="762" y="282" class="tx">Altman and Amodei to</text>
  <text x="762" y="296" class="tx">appear (Hanson-Young)</text>
  <text x="762" y="314" class="tx">After the Medicare</text>
  <text x="762" y="328" class="tx">portal breach</text>

  <!-- footer -->
  <text x="30" y="424" class="ft">Positions going into the week</text>
  <rect x="30" y="436" width="12" height="12" rx="2" fill="#2563eb33" stroke="#2563eb"/>
  <text x="50" y="447" class="fs">Amodei and Altman: coordinated "pace the frontier"; OpenAI now paused for the second time in three months</text>
  <rect x="30" y="458" width="12" height="12" rx="2" fill="#d9770633" stroke="#d97706"/>
  <text x="50" y="469" class="fs">Zuckerberg (NBC, Sep 24): "I don't think that we need some kind of industrywide coordination"</text>
  <rect x="30" y="480" width="12" height="12" rx="2" fill="#dc262633" stroke="#dc2626"/>
  <text x="50" y="491" class="fs">Trump: has called claims about AI's threat a "hoax"; Johnson: "what role, if any, the government has to play"</text>
</svg>
