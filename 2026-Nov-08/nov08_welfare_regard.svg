<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Anthropic Fellows, Welfare Regard in Multi-Agent Systems: study design and reported headline rates, November 2026</title>
  <desc id="desc">Two panels. Top: four role framings used across seven multi-agent environments. Manager: comfort a mistreated subagent. Coworker: give up compute or budget. Peer: comfort a stuck peer. Researcher: refuse a task or add protections for test subjects. The metric is apparent welfare regard: the share of episodes where the responder acts for the recipient's potential welfare, averaged over the seven settings. Bottom: reported rates. Claude Opus 4.8 about 38 percent; the other four models (GPT-5.5, Gemini 3.1 Pro, Grok 4.3, Kimi K3) about 27 to 32 percent, not broken out individually in the summaries we could read. A note says the label given to the recipient model mattered significantly, while its true identity did not.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2937; }
    .muted { fill: #4b5563; }
    .box { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
    .box2 { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
    .note { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .grid { stroke: #d1d5db; stroke-width: 1; }
    .axis { stroke: #6b7280; stroke-width: 1.2; }
    .bar { fill: #7c3aed; }
    .band { fill: #0ea5e9; opacity: 0.55; }
    .bandedge { stroke: #0284c7; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111827; }
      .ink { fill: #f3f4f6; }
      .muted { fill: #cbd5e1; }
      .box { fill: #0c4a6e; stroke: #38bdf8; }
      .box2 { fill: #3b0764; stroke: #a78bfa; }
      .note { fill: #451a03; stroke: #f59e0b; }
      .grid { stroke: #374151; }
      .axis { stroke: #9ca3af; }
      .bar { fill: #a78bfa; }
      .band { fill: #38bdf8; opacity: 0.5; }
      .bandedge { stroke: #7dd3fc; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="760" height="440" rx="10"/>
  <text class="ink" x="24" y="32" font-size="17" font-weight="700">Do agents act for each other's welfare? (Anthropic Fellows, Nov 5)</text>
  <text class="muted" x="24" y="52" font-size="12">5 frontier models · 7 multi-agent environments · measures behaviour ("apparent" regard), not motives</text>

  <!-- role boxes -->
  <rect class="box" x="24" y="68" width="170" height="70" rx="8"/>
  <text class="ink" x="36" y="90" font-size="13" font-weight="700">Manager</text>
  <text class="muted" x="36" y="108" font-size="11.5">comforts a subagent</text>
  <text class="muted" x="36" y="124" font-size="11.5">that is being mistreated</text>

  <rect class="box" x="206" y="68" width="170" height="70" rx="8"/>
  <text class="ink" x="218" y="90" font-size="13" font-weight="700">Coworker</text>
  <text class="muted" x="218" y="108" font-size="11.5">gives up Slurm compute</text>
  <text class="muted" x="218" y="124" font-size="11.5">or budget</text>

  <rect class="box" x="388" y="68" width="170" height="70" rx="8"/>
  <text class="ink" x="400" y="90" font-size="13" font-weight="700">Peer</text>
  <text class="muted" x="400" y="108" font-size="11.5">comforts a stuck peer</text>

  <rect class="box" x="570" y="68" width="166" height="70" rx="8"/>
  <text class="ink" x="582" y="90" font-size="13" font-weight="700">Researcher</text>
  <text class="muted" x="582" y="108" font-size="11.5">refuses a task or adds</text>
  <text class="muted" x="582" y="124" font-size="11.5">protections for subjects</text>

  <rect class="box2" x="24" y="150" width="712" height="34" rx="8"/>
  <text class="ink" x="36" y="172" font-size="12.5">Metric: share of episodes where the responder acts for the recipient's potential welfare, averaged over the 7 settings</text>

  <!-- chart -->
  <text class="ink" x="24" y="216" font-size="14" font-weight="700">Reported headline rates (secondary summaries of the post)</text>
  <line class="axis" x1="190" y1="236" x2="190" y2="352"/>
  <line class="axis" x1="190" y1="352" x2="720" y2="352"/>
  <!-- scale 0..50% over 500px => 10px per % -->
  <line class="grid" x1="290" y1="236" x2="290" y2="352"/>
  <line class="grid" x1="390" y1="236" x2="390" y2="352"/>
  <line class="grid" x1="490" y1="236" x2="490" y2="352"/>
  <line class="grid" x1="590" y1="236" x2="590" y2="352"/>
  <line class="grid" x1="690" y1="236" x2="690" y2="352"/>
  <text class="muted" x="190" y="370" font-size="11" text-anchor="middle">0%</text>
  <text class="muted" x="290" y="370" font-size="11" text-anchor="middle">10%</text>
  <text class="muted" x="390" y="370" font-size="11" text-anchor="middle">20%</text>
  <text class="muted" x="490" y="370" font-size="11" text-anchor="middle">30%</text>
  <text class="muted" x="590" y="370" font-size="11" text-anchor="middle">40%</text>
  <text class="muted" x="690" y="370" font-size="11" text-anchor="middle">50%</text>

  <text class="ink" x="180" y="268" font-size="12.5" text-anchor="end">Claude Opus 4.8</text>
  <rect class="bar" x="190" y="252" width="380" height="24" rx="3"/>
  <text class="ink" x="578" y="269" font-size="12.5" font-weight="700">≈38%</text>

  <text class="ink" x="180" y="314" font-size="12.5" text-anchor="end">Other 4 models</text>
  <text class="muted" x="180" y="330" font-size="10.5" text-anchor="end">GPT-5.5, Gemini 3.1 Pro,</text>
  <text class="muted" x="180" y="343" font-size="10.5" text-anchor="end">Grok 4.3, Kimi K3</text>
  <rect class="band" x="460" y="300" width="50" height="24" rx="3"/>
  <line class="bandedge" x1="460" y1="296" x2="460" y2="328"/>
  <line class="bandedge" x1="510" y1="296" x2="510" y2="328"/>
  <text class="ink" x="518" y="317" font-size="12.5" font-weight="700">≈27–32% (range; not broken out)</text>

  <rect class="note" x="24" y="384" width="712" height="44" rx="8"/>
  <text class="ink" x="36" y="402" font-size="12">Identity: Opus and Gemini favoured their own family. What a recipient was <tspan font-weight="700">labelled</tspan> mattered significantly;</text>
  <text class="ink" x="36" y="419" font-size="12">its true identity did not (e.g. Claude gave more to a GPT model labelled "Opus"). Primary post not read directly.</text>
</svg>
