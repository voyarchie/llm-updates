<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How one operator used an agent stack against South Korean finance, late Sep to early Oct 2026</title>
  <desc id="desc">Five boxes left to right. Operator: Chinese-speaking and financially motivated, per CrowdStrike at moderate confidence. Claude Code harness: a CLAUDE.md file holds a Chinese-language pentest prompt, with memory files and session histories; the operator also asked where stolen Korean data is sold. ARTEX: an open-source Chinese agentic pentest tool, closed-sourced by its developer on Oct 8. Model backends: DeepSeek V4.1-Flash as the primary model, with GLM-5.3 and Grok 4.6 through a reseller. Targets: Korean financial firms, seven institutions confirmed by Korean authorities, about 25,000 Shinhan Bank customer records, and 119 KB Kookmin customers. A lower band shows that open directories on the attacker's servers exposed the session histories, configuration and memory files, which let CrowdStrike reconstruct the campaign and publish on Oct 7. Footer: models from three labs in one intrusion, none of them a restricted frontier model; the operator's own logs, not model safeguards, exposed it.</desc>
  <style>
    .hd{fill:#64748b;font-size:20px;font-weight:700}
    .sub{fill:#7c8aa0;font-size:12px}
    .lb{fill:#708098;font-size:13px;font-weight:700}
    .tx{fill:#7c8aa0;font-size:11.5px}
    .ft{fill:#708098;font-size:12.5px;font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="30" y="36" class="hd">One operator, one harness, three labs' models</text>
  <text x="30" y="57" class="sub">The ARTEX campaign against South Korean finance, as reconstructed by CrowdStrike (Oct 7) and Korean reporting. Figures are second-hand.</text>

  <!-- Operator -->
  <rect x="30" y="90" width="160" height="150" rx="10" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.6"/>
  <text x="44" y="114" class="lb">Operator</text>
  <text x="44" y="138" class="tx">Chinese-speaking,</text>
  <text x="44" y="155" class="tx">financially motivated</text>
  <text x="44" y="172" class="tx">(CrowdStrike, moderate</text>
  <text x="44" y="189" class="tx">confidence). A CV in the</text>
  <text x="44" y="206" class="tx">logs may identify them.</text>

  <!-- Claude Code -->
  <rect x="215" y="90" width="160" height="150" rx="10" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.6"/>
  <text x="229" y="114" class="lb">Claude Code harness</text>
  <text x="229" y="138" class="tx">CLAUDE.md holds a</text>
  <text x="229" y="155" class="tx">Chinese pentest prompt;</text>
  <text x="229" y="172" class="tx">memory files, session</text>
  <text x="229" y="189" class="tx">histories; asks where</text>
  <text x="229" y="206" class="tx">stolen data is sold</text>

  <!-- ARTEX -->
  <rect x="400" y="90" width="160" height="150" rx="10" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.6"/>
  <text x="414" y="114" class="lb">ARTEX agent</text>
  <text x="414" y="138" class="tx">Open-source Chinese</text>
  <text x="414" y="155" class="tx">agentic pentest tool;</text>
  <text x="414" y="172" class="tx">"for learning only."</text>
  <text x="414" y="189" class="tx">Closed-sourced by its</text>
  <text x="414" y="206" class="tx">developer on Oct 8</text>

  <!-- Models -->
  <rect x="585" y="90" width="160" height="150" rx="10" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.6"/>
  <text x="599" y="114" class="lb">Model backends</text>
  <text x="599" y="138" class="tx">DeepSeek V4.1-Flash</text>
  <text x="599" y="155" class="tx">(primary, open weights)</text>
  <text x="599" y="172" class="tx">GLM-5.3 and Grok 4.6</text>
  <text x="599" y="189" class="tx">via a reseller in other</text>
  <text x="599" y="206" class="tx">sessions</text>

  <!-- Targets -->
  <rect x="770" y="90" width="160" height="150" rx="10" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.6"/>
  <text x="784" y="114" class="lb">Korean finance</text>
  <text x="784" y="138" class="tx">Late Sep to early Oct;</text>
  <text x="784" y="155" class="tx">7 institutions confirmed;</text>
  <text x="784" y="172" class="tx">~25k Shinhan customers;</text>
  <text x="784" y="189" class="tx">119 KB Kookmin clients;</text>
  <text x="784" y="206" class="tx">loan-inquiry system hit</text>

  <!-- arrows -->
  <line x1="191" y1="165" x2="212" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="376" y1="165" x2="397" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="561" y1="165" x2="582" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="746" y1="165" x2="767" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- leak band -->
  <path d="M295,241 L295,300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <path d="M480,241 L480,300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <rect x="215" y="304" width="530" height="78" rx="10" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.6"/>
  <text x="229" y="328" class="lb">How it was caught: the operator's own open directories</text>
  <text x="229" y="350" class="tx">Session histories, ARTEX configs and Claude memory files sat on exposed servers.</text>
  <text x="229" y="367" class="tx">CrowdStrike linked them by IP overlap and published Oct 7; Korean police are investigating.</text>

  <!-- footer -->
  <line x1="30" y1="408" x2="930" y2="408" stroke="#94a3b8" stroke-opacity="0.4"/>
  <text x="30" y="432" class="ft">Models from three labs in one intrusion, none of them a restricted frontier model.</text>
  <text x="30" y="452" class="ft">The harness is the reusable part. Sloppy logs, not model safeguards, exposed it.</text>
</svg>
