<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">SemiAnalysis GDPx v1.0 headline leaderboard, November 2 2026</title>
  <desc id="desc">Horizontal bar chart on a 0 to 100 percent scale. Claude Opus 5.5 scores 12.0 percent, Gemini 4 Carbon 10.9 percent, GPT-6 Astra 9.6 percent. The remaining 88 percent or more of the scale is empty, showing how far every model is from saturating the benchmark. 206 tasks across 11 equally weighted domains, averaged over three attempts. Finance and legal score 0 percent for every model under binary grading.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2937; }
    .muted { fill: #4b5563; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .track { fill: #f3f4f6; }
    .a { fill: #d97706; }
    .g { fill: #2563eb; }
    .o { fill: #0d9488; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .grid { stroke: #334155; }
      .track { fill: #1e293b; }
      .a { fill: #fbbf24; }
      .g { fill: #60a5fa; }
      .o { fill: #2dd4bf; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
  <text class="ink" x="24" y="34" font-size="18" font-weight="700">GDPx v1.0: the best frontier agent completes about 1 in 8 tasks</text>
  <text class="muted" x="24" y="56" font-size="13">Headline score, 0–100% scale · 206 tasks, 11 equally weighted domains, mean of 3 attempts</text>

  <!-- x axis: 180..700 = 0..100 (5.2 px per point) -->
  <line class="grid" x1="180" y1="78" x2="180" y2="250"/>
  <line class="grid" x1="310" y1="78" x2="310" y2="250"/>
  <line class="grid" x1="440" y1="78" x2="440" y2="250"/>
  <line class="grid" x1="570" y1="78" x2="570" y2="250"/>
  <line class="grid" x1="700" y1="78" x2="700" y2="250"/>
  <text class="muted" x="180" y="268" font-size="12" text-anchor="middle">0%</text>
  <text class="muted" x="310" y="268" font-size="12" text-anchor="middle">25%</text>
  <text class="muted" x="440" y="268" font-size="12" text-anchor="middle">50%</text>
  <text class="muted" x="570" y="268" font-size="12" text-anchor="middle">75%</text>
  <text class="muted" x="700" y="268" font-size="12" text-anchor="middle">100%</text>

  <text class="ink" x="168" y="112" font-size="14" text-anchor="end">Claude Opus 5.5</text>
  <rect class="track" x="180" y="92" width="520" height="30" rx="3"/>
  <rect class="a" x="180" y="92" width="62.4" height="30" rx="3"/>
  <text class="ink" x="250" y="112" font-size="14" font-weight="700">12.0%</text>

  <text class="ink" x="168" y="164" font-size="14" text-anchor="end">Gemini 4 Carbon</text>
  <rect class="track" x="180" y="144" width="520" height="30" rx="3"/>
  <rect class="g" x="180" y="144" width="56.7" height="30" rx="3"/>
  <text class="ink" x="244" y="164" font-size="14" font-weight="700">10.9%</text>

  <text class="ink" x="168" y="216" font-size="14" text-anchor="end">GPT-6 Astra</text>
  <rect class="track" x="180" y="196" width="520" height="30" rx="3"/>
  <rect class="o" x="180" y="196" width="49.9" height="30" rx="3"/>
  <text class="ink" x="238" y="216" font-size="14" font-weight="700">9.6%</text>

  <text class="muted" x="24" y="296" font-size="12">Finance and legal: 0% for every model under binary grading. SemiAnalysis says safety classifiers lower Opus 5.5 and</text>
  <text class="muted" x="24" y="314" font-size="12">GPT-6 Astra in cyber, biology and alignment, and publishes a second ranking without those domains. Source: SemiAnalysis, Nov 2 2026.</text>
</svg>
