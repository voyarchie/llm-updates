<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The floor stops falling — DeepSeek reverses the price war on Aug 16 2026, under a frozen ceiling</title>
  <desc id="desc">A diagram in three bands. The top band, drawn as a dashed indigo box, is the frozen closed ceiling, unchanged for a fifth straight brief: Claude Opus 5 at Index 63 for 25 dollars, still number one and uncut; Fable 5 at 62 for 50 dollars; GPT-5.6 Sol at 61 for 30 dollars; Grok 4.6 at 61 for 6 dollars; with no Index-64 model and no flagship price cut since July 24, and Gemini 3.5 Pro still absent. The middle band shows the price war reversing. On the left, an emerald box marks the downward phase from July 30 to August 3: OpenAI cut GPT-5.6 Luna by 80 percent to 1.20 dollars, and DeepSeek countered not with a discount but with capability at pennies, its V4-Flash floor at Index 50 for 0.28 dollars under an MIT license. A bent arrow turns upward at August 16, 16:00 UTC, into an amber box on the right marking the reversal: DeepSeek ships V4-Pro-0813 at general availability, Index 53, built on a new V4 hybrid-attention architecture, and raises prices while introducing peak and off-peak surge billing. The bottom band lists the price deltas: V4-Flash output rises from 0.28 to 1.32 dollars at peak or 0.66 off-peak; V4-Pro output from 0.87 to 3.96 dollars at peak or 1.98 off-peak; V4-Pro cached input from 0.003625 dollars up to as much as the new peak rate, roughly an 1,100 percent increase; and the stated cause is demand outstripping compute capacity, not competition.</desc>

  <!-- ===== Title ===== -->
  <text x="40" y="40" font-size="21" font-weight="700" fill="#64748b">The floor stops falling</text>
  <text x="40" y="64" font-size="14" fill="#94a3b8">DeepSeek reverses the price war — Aug 16 2026, 16:00 UTC — while the closed ceiling stays frozen a 5th brief</text>

  <!-- ===== Ceiling band (dashed indigo) ===== -->
  <rect x="40" y="86" width="800" height="86" rx="10" fill="none" stroke="#818cf8" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="56" y="110" font-size="12.5" font-weight="700" fill="#818cf8">FROZEN CEILING — 5th straight brief</text>
  <text x="56" y="130" font-size="12" fill="#64748b"><tspan font-weight="700" fill="#64748b">Opus 5</tspan> Index 63 · $25 · #1, uncut</text>
  <text x="290" y="130" font-size="12" fill="#64748b"><tspan font-weight="700">Fable 5</tspan> 62 · $50</text>
  <text x="470" y="130" font-size="12" fill="#64748b"><tspan font-weight="700">GPT-5.6 Sol</tspan> 61 · $30</text>
  <text x="670" y="130" font-size="12" fill="#64748b"><tspan font-weight="700">Grok 4.6</tspan> 61 · $6</text>
  <text x="56" y="152" font-size="11.5" fill="#94a3b8">No Index-64 model · no flagship price cut since Jul 24 · Gemini 3.5 Pro still absent (delayed)</text>

  <!-- ===== Middle band: the reversal ===== -->
  <!-- Down phase (emerald) -->
  <rect x="40" y="210" width="330" height="150" rx="10" fill="none" stroke="#10b981" stroke-width="1.8"/>
  <text x="58" y="236" font-size="13" font-weight="700" fill="#10b981">PRICE WAR &#8595;  (Jul 30 – Aug 3)</text>
  <text x="58" y="262" font-size="12" fill="#64748b">OpenAI cut GPT-5.6 Luna &#8722;80% &#8594; $1.20</text>
  <text x="58" y="286" font-size="12" fill="#64748b">DeepSeek answered not with a discount</text>
  <text x="58" y="304" font-size="12" fill="#64748b">but with <tspan font-weight="700">capability at pennies</tspan>:</text>
  <text x="58" y="328" font-size="12" fill="#64748b">V4-Flash floor <tspan font-weight="700">Index 50 · $0.28</tspan> · MIT</text>
  <text x="58" y="348" font-size="11.5" fill="#94a3b8">the floor this series quoted every brief</text>

  <!-- Bent arrow turning up -->
  <path d="M 372 300 Q 435 300 435 250 Q 435 210 500 210" fill="none" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="388" y="322" font-size="11" font-weight="700" fill="#f59e0b">Aug 16</text>
  <text x="388" y="337" font-size="10.5" fill="#94a3b8">16:00 UTC</text>

  <!-- Up phase (amber) -->
  <rect x="510" y="210" width="330" height="150" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="528" y="236" font-size="13" font-weight="700" fill="#f59e0b">REVERSAL &#8593;  (Aug 16)</text>
  <text x="528" y="262" font-size="12" fill="#64748b"><tspan font-weight="700">V4-Pro-0813</tspan> ships GA · <tspan font-weight="700">Index 53</tspan></text>
  <text x="528" y="286" font-size="12" fill="#64748b">new <tspan font-weight="700">V4 Hybrid Attention</tspan> arch</text>
  <text x="528" y="304" font-size="11.5" fill="#94a3b8">(CSA + HCA + DSA · ~73% less compute)</text>
  <text x="528" y="330" font-size="12" fill="#64748b">Prices raised + first-ever</text>
  <text x="528" y="348" font-size="12" fill="#64748b"><tspan font-weight="700">peak / off-peak surge</tspan> billing (off-peak = &#189; peak)</text>

  <!-- ===== Bottom band: price deltas ===== -->
  <rect x="40" y="392" width="800" height="140" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="58" y="416" font-size="12.5" font-weight="700" fill="#64748b">What actually changed at 16:00 UTC Aug 16 (per-Mtok)</text>

  <text x="58" y="442" font-size="12" fill="#64748b">V4-Flash output</text>
  <text x="230" y="442" font-size="12" fill="#10b981">$0.28</text>
  <text x="278" y="442" font-size="12" fill="#94a3b8">&#8594;</text>
  <text x="300" y="442" font-size="12" fill="#ef4444" font-weight="700">$1.32 peak</text>
  <text x="390" y="442" font-size="12" fill="#64748b">/ $0.66 off-peak</text>

  <text x="58" y="466" font-size="12" fill="#64748b">V4-Pro output</text>
  <text x="230" y="466" font-size="12" fill="#10b981">$0.87</text>
  <text x="278" y="466" font-size="12" fill="#94a3b8">&#8594;</text>
  <text x="300" y="466" font-size="12" fill="#ef4444" font-weight="700">$3.96 peak</text>
  <text x="390" y="466" font-size="12" fill="#64748b">/ $1.98 off-peak</text>

  <text x="58" y="490" font-size="12" fill="#64748b">V4-Pro cached input</text>
  <text x="230" y="490" font-size="12" fill="#10b981">$0.003625</text>
  <text x="300" y="490" font-size="12" fill="#94a3b8">&#8594;</text>
  <text x="322" y="490" font-size="12" fill="#ef4444" font-weight="700">up to peak rate</text>
  <text x="430" y="490" font-size="12" fill="#94a3b8">(&#8776; +1,100% headline)</text>

  <text x="58" y="518" font-size="12" fill="#64748b"><tspan font-weight="700">Cause:</tspan> demand outstripping compute capacity — <tspan font-style="italic">not</tspan> competition. Weights stay open on HF (self-host = no surge).</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
