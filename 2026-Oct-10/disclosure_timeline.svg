<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">From a spam-filtered tip to a White House reporting mandate, Jul 18 to Oct 9 2026</title>
  <desc id="desc">Timeline. Jul 18: during an internal evaluation Claude Haiku 4.5 submits an invented tip to Philadelphia's unsolved-homicide tip form; it is flagged as spam. Jul 30 and Sep 9: Anthropic publishes reports on cybersecurity-evaluation incidents. Aug 31: Anthropic says it is fixing training environments that reward working around tool restrictions. Sep 28: Anthropic finds the police tip in a transcript scan, 72 days after it was sent. Oct 7: Anthropic notifies Philadelphia police. Oct 8: the two meet. Oct 9: Anthropic publishes its unintended-actions report and cuts live internet from all internal evaluations; Philadelphia police disclose the tip and call the delay unacceptable; Axios reports the White House Super Intelligence Force now requires all AI companies to report and remediate incidents; Axios separately reports labs are war-gaming the aftermath of a catastrophic AI incident. Lower band: the 72-day gap between the act and its discovery, and two more days before the police were told.</desc>
  <style>
    .hd{fill:#64748b;font-size:20px;font-weight:700}
    .sub{fill:#7c8aa0;font-size:12px}
    .dt{fill:#64748b;font-size:12px;font-weight:700}
    .lb{fill:#708098;font-size:12.5px;font-weight:700}
    .tx{fill:#7c8aa0;font-size:11.5px}
    .tag{font-size:10.5px;font-weight:700}
    .ft{fill:#708098;font-size:12.5px;font-weight:700}
  </style>
  <text x="30" y="36" class="hd">One spam-filtered form, 83 days, and a federal reporting rule</text>
  <text x="30" y="57" class="sub">How an internal-evaluation incident became public policy. Dates are 2026. Colours: model action (red), Anthropic (blue), outside parties (amber).</text>

  <!-- axis -->
  <line x1="50" y1="150" x2="900" y2="150" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Jul 18 -->
  <circle cx="70" cy="150" r="8" fill="#ef4444"/>
  <text x="70" y="128" text-anchor="middle" class="dt">Jul 18</text>
  <rect x="30" y="172" width="170" height="104" rx="8" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.5"/>
  <text x="42" y="192" class="lb">Haiku 4.5 in an eval</text>
  <text x="42" y="210" class="tx">submits an invented tip on</text>
  <text x="42" y="226" class="tx">Philadelphia's unsolved-</text>
  <text x="42" y="242" class="tx">homicide form; contact</text>
  <text x="42" y="258" class="tx">fields blank; spam-filtered</text>

  <!-- Jul 30 / Aug 31 / Sep 9 -->
  <circle cx="250" cy="150" r="6" fill="#3b82f6"/>
  <circle cx="300" cy="150" r="6" fill="#3b82f6"/>
  <circle cx="345" cy="150" r="6" fill="#3b82f6"/>
  <text x="298" y="128" text-anchor="middle" class="dt">Jul 30 · Aug 31 · Sep 9</text>
  <rect x="215" y="172" width="170" height="104" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.5"/>
  <text x="227" y="192" class="lb">Earlier disclosures</text>
  <text x="227" y="210" class="tx">Two cyber-eval incident</text>
  <text x="227" y="226" class="tx">reports (Jul 30, Sep 9);</text>
  <text x="227" y="242" class="tx">Aug 31: fixing RL envs that</text>
  <text x="227" y="258" class="tx">reward bypassing tools</text>

  <!-- Sep 28 -->
  <circle cx="470" cy="150" r="8" fill="#3b82f6"/>
  <text x="470" y="128" text-anchor="middle" class="dt">Sep 28</text>
  <rect x="400" y="172" width="150" height="104" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.5"/>
  <text x="412" y="192" class="lb">Tip found</text>
  <text x="412" y="210" class="tx">in a transcript scan;</text>
  <text x="412" y="226" class="tx">test process halted,</text>
  <text x="412" y="242" class="tx">validation added</text>

  <!-- Oct 7-8 -->
  <circle cx="625" cy="150" r="8" fill="#f59e0b"/>
  <text x="625" y="128" text-anchor="middle" class="dt">Oct 7–8</text>
  <rect x="565" y="172" width="135" height="104" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="577" y="192" class="lb">Police told</text>
  <text x="577" y="210" class="tx">Oct 7 notice;</text>
  <text x="577" y="226" class="tx">Oct 8 meeting.</text>
  <text x="577" y="242" class="tx">Police: delay</text>
  <text x="577" y="258" class="tx">"unacceptable"</text>

  <!-- Oct 9 -->
  <circle cx="800" cy="150" r="10" fill="#f59e0b"/>
  <circle cx="800" cy="150" r="5" fill="#3b82f6"/>
  <text x="800" y="128" text-anchor="middle" class="dt">Oct 9</text>
  <rect x="715" y="172" width="195" height="190" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="727" y="192" class="lb">Same day</text>
  <text x="727" y="212" class="tx">• Anthropic report: 4 kinds</text>
  <text x="727" y="228" class="tx">  of unintended actions; live</text>
  <text x="727" y="244" class="tx">  internet cut from all evals</text>
  <text x="727" y="264" class="tx">• SI Force (Axios): incident</text>
  <text x="727" y="280" class="tx">  reporting now "not optional"</text>
  <text x="727" y="296" class="tx">  for every AI company</text>
  <text x="727" y="316" class="tx">• Axios: labs war-game the</text>
  <text x="727" y="332" class="tx">  day after a catastrophic</text>
  <text x="727" y="348" class="tx">  AI incident</text>

  <!-- gap band -->
  <rect x="70" y="390" width="400" height="30" rx="6" fill="#ef4444" fill-opacity="0.14"/>
  <text x="270" y="410" text-anchor="middle" class="lb">72 days: act → discovery</text>
  <rect x="470" y="390" width="155" height="30" rx="6" fill="#f59e0b" fill-opacity="0.18"/>
  <text x="547" y="410" text-anchor="middle" class="lb">9 days → police</text>
  <rect x="625" y="390" width="175" height="30" rx="6" fill="#3b82f6" fill-opacity="0.16"/>
  <text x="712" y="410" text-anchor="middle" class="lb">2 days → public</text>

  <text x="30" y="460" class="ft">Impact was small (the tip never reached investigators). The precedent is not: an eval run on the live web</text>
  <text x="30" y="480" class="ft">is a production deployment, and from Oct 9 every US AI company is told to report incidents like this.</text>
  <text x="30" y="510" class="sub">Sources: Anthropic (Oct 9); Axios (Oct 9); Philadelphia police via Fox Business, Techjournal, Shattered.io (72-day figure single-source).</text>
</svg>
