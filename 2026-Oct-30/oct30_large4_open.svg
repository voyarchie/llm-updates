<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Mistral Large 4 open weights: where it ranks among open models</title>
  <desc id="desc">Three panels. Left, Artificial Analysis Intelligence Index v5 among open-weight models: Kimi K3.1 Pro 46 (weights pending), DeepSeek V4.1 Flash 1017 32, GLM-5.3 32, Mistral Large 4 (high) 26, Mistral Large 4 Preview 25. Middle, Artificial Analysis Cyber Index: DeepSeek V4.1 Flash 1017 57, MiMo-V2.6-Pro 56, Mistral Large 4 51. Right, Coding Agent Index: GLM-5.3 (max, Opencode) 49 using 15.9M tokens per task, Mistral Large 4 (high, Mistral Vibe) 48 using 8.5M tokens per task. Footnote: Terminal-Bench 4.0, Mistral reports 41 percent, Artificial Analysis measured 25 percent. Sources: Artificial Analysis and Mistral, Oct 29 2026, via coverage.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2937; }
    .muted { fill: #4b5563; }
    .card { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.2; }
    .old { fill: #9ca3af; }
    .new { fill: #ea580c; }
    .pend { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .hd { fill: #111827; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .card { fill: #1e293b; stroke: #334155; }
      .old { fill: #64748b; }
      .new { fill: #fb923c; }
      .pend { stroke: #94a3b8; }
      .hd { fill: #f3f4f6; }
    }
    text { font-size: 13px; }
    .t { font-size: 18px; font-weight: 600; }
    .h { font-size: 14px; font-weight: 600; }
    .v { font-size: 13px; font-weight: 600; }
    .s { font-size: 12px; }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="440" rx="10"/>
  <text class="t hd" x="24" y="34">Mistral Large 4 goes open weight: top non-Chinese open model, not top open model (Oct 29)</text>

  <!-- Panel 1: Intelligence Index v5 (scale: 4px per point) -->
  <rect class="card" x="24" y="52" width="300" height="320" rx="8"/>
  <text class="h ink" x="40" y="78">AA Intelligence Index v5</text>
  <text class="s muted" x="40" y="96">open-weight models</text>
  <text class="ink s" x="40" y="132">Kimi K3.1 Pro*</text>
  <rect class="pend" x="150" y="118" width="138" height="20" rx="3"/>
  <text class="v ink" x="294" y="133">46</text>
  <text class="ink s" x="40" y="172">DS V4.1 Flash</text>
  <rect class="old" x="150" y="158" width="96" height="20" rx="3"/>
  <text class="v ink" x="252" y="173">32</text>
  <text class="ink s" x="40" y="212">GLM-5.3</text>
  <rect class="old" x="150" y="198" width="96" height="20" rx="3"/>
  <text class="v ink" x="252" y="213">32</text>
  <text class="ink s" x="40" y="252">Large 4 (high)</text>
  <rect class="new" x="150" y="238" width="78" height="20" rx="3"/>
  <text class="v ink" x="234" y="253">26</text>
  <text class="ink s" x="40" y="292">Large 4 Preview</text>
  <rect class="old" x="150" y="278" width="75" height="20" rx="3"/>
  <text class="v ink" x="231" y="293">25</text>
  <text class="s muted" x="40" y="330">* weights promised by Nov 4</text>
  <text class="s muted" x="40" y="350">Closed leader: Gemini 4 Carbon 59</text>

  <!-- Panel 2: Cyber Index (scale: 3px per point) -->
  <rect class="card" x="336" y="52" width="290" height="320" rx="8"/>
  <text class="h ink" x="352" y="78">AA Cyber Index</text>
  <text class="s muted" x="352" y="96">current open-weight models</text>
  <text class="ink s" x="352" y="152">DS V4.1 Flash</text>
  <rect class="old" x="470" y="138" width="114" height="22" rx="3"/>
  <text class="v ink" x="590" y="154">57</text>
  <text class="ink s" x="352" y="202">MiMo-V2.6-Pro</text>
  <rect class="old" x="470" y="188" width="112" height="22" rx="3"/>
  <text class="v ink" x="588" y="204">56</text>
  <text class="ink s" x="352" y="252">Large 4 (high)</text>
  <rect class="new" x="470" y="238" width="102" height="22" rx="3"/>
  <text class="v ink" x="578" y="254">51</text>
  <text class="s muted" x="352" y="310">Large 4 is pitched at defensive</text>
  <text class="s muted" x="352" y="328">security, but ranks third</text>
  <text class="s muted" x="352" y="346">among open models here.</text>

  <!-- Panel 3: Coding Agent Index (scale: 3px per point) -->
  <rect class="card" x="638" y="52" width="298" height="320" rx="8"/>
  <text class="h ink" x="654" y="78">AA Coding Agent Index</text>
  <text class="s muted" x="654" y="96">best open-weight entries</text>
  <text class="ink s" x="654" y="142">GLM-5.3 (max)</text>
  <text class="s muted" x="654" y="158">Opencode</text>
  <rect class="old" x="760" y="134" width="147" height="22" rx="3"/>
  <text class="v ink" x="760" y="178">49 · 15.9M tokens/task</text>
  <text class="ink s" x="654" y="222">Large 4 (high)</text>
  <text class="s muted" x="654" y="238">Mistral Vibe</text>
  <rect class="new" x="760" y="214" width="144" height="22" rx="3"/>
  <text class="v ink" x="760" y="258">48 · 8.5M tokens/task</text>
  <text class="s muted" x="654" y="310">One point behind on score,</text>
  <text class="s muted" x="654" y="328">about half the tokens.</text>
  <text class="s muted" x="654" y="346">Closed leader: Opus 5.5 62</text>

  <text class="s muted" x="24" y="398">Terminal-Bench 4.0: Mistral reports 41% (preview 28%); Artificial Analysis measured 25%. 1.05T total / 52B active (49B in experts).</text>
  <text class="s muted" x="24" y="420">Sources: Artificial Analysis (X post, Oct 29), Mistral, VentureBeat, Trending Topics, via search coverage. Scores are AA v5 series.</text>
</svg>
