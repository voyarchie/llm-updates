<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Diagram titled the open-weights promise lands cleanly, but splits into three release patterns the same day, as of August 16 2026. Across the top a shaded horizontal band marks the frozen closed ceiling, unchanged for a fourth straight brief, holding four models: Claude Opus 5 at Index 63, still number one and uncut at 5 slash 25 dollars; Claude Fable 5 at 62; and GPT-5.6 Sol and Grok 4.6 tied at 61. A note says no Index 64 model and no flagship price cut since July 24, and Gemini 3.5 Pro is still off the board, delayed again per Forbes on August 13. Below the ceiling is a horizontal openness spectrum running from left, labelled gated or held, to right, labelled open plus runnable now. Three Chinese open releases from this window sit along it. On the left, Qwen3.8-Max whose weights shipped August 12 to 13 is open but degraded: text only, no 1 million context, under a revenue-share license, not permissive. In the middle, GLM-5.3 from Z.ai launched August 14 is a frontier open-weights coder built by post-training only on the 743 billion parameter GLM-5.2 base, pitched as the strongest open coder with an emergent cyber capability leading CyberGym, but its weights are held about two weeks for a safety evaluation, open on a timer, expected end of August, available now only by API on the 18 dollar a month GLM Coding Plan. On the far right, the clean win, Qwen3.8-27B launched August 14 and number one on Hacker News August 15 is a dense 27 billion parameter model under a permissive Apache 2.0 license, 55.6 gigabytes, downloadable now and runnable quantized on a single 24 gigabyte consumer GPU, resolving the August 14 watch-item positively. A caption concludes that the open-weights question the series tracked since July finally resolves yes for the small runnable tier, while the closed ceiling stays frozen and unanswered for a fourth brief.">
  <title>The open-weights promise lands cleanly — but splits into three release patterns the same day (Qwen3.8-Max degraded/gated · GLM-5.3 open-on-a-safety-timer · Qwen3.8-27B clean Apache-2.0 runnable-now) — while the closed ceiling stays frozen a 4th brief (Opus 5 #1/63, uncut)</title>

  <!-- theme-neutral palette: slate text (#64748b heading / #94a3b8 body) reads on light and dark; saturated fills with strokes for markers. amber = gated/held, violet = safety-hold, green = clean open win, blue = Opus 5 #1, grey = other ceiling models. -->
  <text x="24" y="30" font-size="19" font-weight="700" fill="#64748b">The open-weights promise lands cleanly — and splits into three patterns in one day</text>
  <text x="24" y="50" font-size="12.5" fill="#94a3b8">Two Chinese labs, same day (Aug 14). The runnable tier ships clean; the frontier coder ships on a safety timer. The closed ceiling doesn't move.</text>

  <!-- ===== FROZEN CLOSED CEILING BAND ===== -->
  <rect x="110" y="78" width="720" height="86" rx="6" fill="#3b82f6" opacity="0.10"/>
  <rect x="110" y="78" width="720" height="86" rx="6" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  <text x="122" y="96" font-size="11" font-weight="700" fill="#64748b">CLOSED CEILING — FROZEN (4th brief): no Index-64, no flagship cut since Jul 24</text>

  <!-- ceiling chips -->
  <g font-size="11">
    <rect x="126" y="110" width="150" height="40" rx="5" fill="#3b82f6" opacity="0.85"/>
    <text x="201" y="127" fill="#ffffff" text-anchor="middle" font-weight="700">Claude Opus 5 · 63</text>
    <text x="201" y="142" fill="#e0e7ff" text-anchor="middle" font-size="9.5">#1 · uncut · $5/$25</text>

    <rect x="290" y="110" width="140" height="40" rx="5" fill="#64748b" opacity="0.55"/>
    <text x="360" y="127" fill="#ffffff" text-anchor="middle" font-weight="700">Fable 5 · 62</text>
    <text x="360" y="142" fill="#f1f5f9" text-anchor="middle" font-size="9.5">$10/$50</text>

    <rect x="444" y="110" width="150" height="40" rx="5" fill="#64748b" opacity="0.55"/>
    <text x="519" y="127" fill="#ffffff" text-anchor="middle" font-weight="700">Sol · Grok 4.6 · 61</text>
    <text x="519" y="142" fill="#f1f5f9" text-anchor="middle" font-size="9.5">tied #3</text>

    <rect x="608" y="110" width="208" height="40" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3 3"/>
    <text x="712" y="127" fill="#94a3b8" text-anchor="middle" font-weight="700">Gemini 3.5 Pro — still absent</text>
    <text x="712" y="142" fill="#94a3b8" text-anchor="middle" font-size="9.5">delayed again (Forbes, Aug 13)</text>
  </g>

  <!-- ===== OPENNESS SPECTRUM ===== -->
  <text x="24" y="210" font-size="13" font-weight="700" fill="#64748b">THIS WINDOW — the open-weights axis, three release patterns:</text>

  <!-- spectrum axis -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker>
  </defs>
  <line x1="130" y1="250" x2="810" y2="250" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="130" y="240" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="start">◄ GATED / HELD</text>
  <text x="808" y="240" font-size="11" font-weight="700" fill="#22c55e" text-anchor="end">OPEN + RUNNABLE NOW ►</text>
  <line x1="130" y1="245" x2="130" y2="255" stroke="#94a3b8" stroke-width="1.6"/>

  <!-- tick marks for the three -->
  <circle cx="235" cy="250" r="5" fill="#f59e0b"/>
  <circle cx="470" cy="250" r="5" fill="#8b5cf6"/>
  <circle cx="720" cy="250" r="5" fill="#22c55e"/>

  <!-- Card 1: Qwen3.8-Max (degraded/gated) -->
  <rect x="120" y="285" width="220" height="230" rx="7" fill="#f59e0b" opacity="0.10"/>
  <rect x="120" y="285" width="220" height="230" rx="7" fill="none" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="134" y="308" font-size="13" font-weight="700" fill="#64748b">Qwen3.8-Max</text>
  <text x="134" y="325" font-size="10" fill="#94a3b8">Alibaba · weights Aug 12–13</text>
  <line x1="134" y1="334" x2="326" y2="334" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>
  <text x="134" y="354" font-size="11" font-weight="700" fill="#f59e0b">OPEN but DEGRADED</text>
  <g font-size="10.5" fill="#94a3b8">
    <text x="134" y="376">• text-only (no vision)</text>
    <text x="134" y="395">• no 1M context</text>
    <text x="134" y="414">• revenue-share license</text>
    <text x="134" y="433">  (not Apache / MIT)</text>
    <text x="134" y="458" font-size="10" fill="#64748b" font-weight="600">The flagship: shipped,</text>
    <text x="134" y="473" font-size="10" fill="#64748b" font-weight="600">but not the clean open</text>
    <text x="134" y="488" font-size="10" fill="#64748b" font-weight="600">release the thesis wanted.</text>
  </g>

  <!-- Card 2: GLM-5.3 (open on a safety timer) -->
  <rect x="360" y="285" width="220" height="230" rx="7" fill="#8b5cf6" opacity="0.10"/>
  <rect x="360" y="285" width="220" height="230" rx="7" fill="none" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="374" y="308" font-size="13" font-weight="700" fill="#64748b">GLM-5.3</text>
  <text x="374" y="325" font-size="10" fill="#94a3b8">Z.ai · launched Aug 14</text>
  <line x1="374" y1="334" x2="566" y2="334" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>
  <text x="374" y="354" font-size="11" font-weight="700" fill="#8b5cf6">OPEN — ON A TIMER</text>
  <g font-size="10.5" fill="#94a3b8">
    <text x="374" y="376">• 743B base (post-train</text>
    <text x="374" y="393">  only on GLM-5.2)</text>
    <text x="374" y="412">• "strongest open coder"</text>
    <text x="374" y="431">• emergent cyber →</text>
    <text x="374" y="448">  leads CyberGym</text>
    <text x="374" y="467" font-size="10" fill="#64748b" font-weight="600">Weights HELD ~2 wks for</text>
    <text x="374" y="482" font-size="10" fill="#64748b" font-weight="600">safety eval (end-Aug).</text>
    <text x="374" y="497" font-size="10" fill="#64748b" font-weight="600">API now: $18/mo plan.</text>
  </g>

  <!-- Card 3: Qwen3.8-27B (clean win) -->
  <rect x="600" y="285" width="220" height="230" rx="7" fill="#22c55e" opacity="0.12"/>
  <rect x="600" y="285" width="220" height="230" rx="7" fill="none" stroke="#22c55e" stroke-width="1.8"/>
  <text x="614" y="308" font-size="13" font-weight="700" fill="#64748b">Qwen3.8-27B</text>
  <text x="614" y="325" font-size="10" fill="#94a3b8">Alibaba · Aug 14 · #1 HN Aug 15</text>
  <line x1="614" y1="334" x2="806" y2="334" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>
  <text x="614" y="354" font-size="11" font-weight="700" fill="#22c55e">CLEAN OPEN — RUNS NOW</text>
  <g font-size="10.5" fill="#94a3b8">
    <text x="614" y="376">• dense 27B · Apache-2.0</text>
    <text x="614" y="395">• 55.6 GB · downloadable</text>
    <text x="614" y="414">• 1 consumer GPU (24 GB,</text>
    <text x="614" y="431">  quantized)</text>
    <text x="614" y="450">• big agent gains vs 3.6</text>
    <text x="614" y="475" font-size="10" fill="#64748b" font-weight="600">Resolves the Aug-14</text>
    <text x="614" y="490" font-size="10" fill="#64748b" font-weight="600">watch-item POSITIVE:</text>
    <text x="614" y="505" font-size="10" fill="#64748b" font-weight="600">the runnable tier lands.</text>
  </g>

  <!-- bottom caption -->
  <text x="24" y="548" font-size="11.5" fill="#94a3b8">The open-weights question the series has tracked since Jul-17 finally resolves <tspan fill="#22c55e" font-weight="700">yes for the small, runnable tier</tspan> — while the frontier coder ships open <tspan fill="#8b5cf6" font-weight="700">on a safety delay</tspan>,</text>
  <text x="24" y="566" font-size="11.5" fill="#94a3b8">the Max-class flagship stays <tspan fill="#f59e0b" font-weight="700">degraded/gated</tspan>, and the <tspan fill="#3b82f6" font-weight="700">closed ceiling stays frozen and unanswered a 4th brief</tspan> (Opus 5 #1/63, uncut).</text>
</svg>
