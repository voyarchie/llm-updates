<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Horizontal bar chart showing aggregate GPU memory of common deployment tiers against the memory needed to serve Kimi K3, a 2.8-trillion-parameter mixture-of-experts model, as of July 27 2026. A single H100 GPU has 80 gigabytes and cannot load the weights. A single eight-GPU server node has 640 gigabytes, enough to hold a heavily quantized community version near 594 gigabytes but not the native four-bit MXFP4 checkpoint. The native MXFP4 checkpoint needs about 1.4 terabytes, marked by a shaded requirement band from roughly 594 gigabytes to 1.4 terabytes. Only a multi-node cluster of 64 or more accelerators with 1.4 terabytes or more clears the band and can serve the model in production. The chart makes the point that the license is open but practical access is gated by hardware.">
  <title>Open weights, gated access — Kimi K3 clears no tier below a multi-node cluster</title>

  <!-- theme-neutral palette: slate axis/labels read on light and dark; saturated bars carry white or colored labels -->
  <text x="24" y="28" font-size="19" font-weight="700" fill="#64748b">Open weights, but not open access: Kimi K3's hardware wall</text>
  <text x="24" y="48" font-size="12.5" fill="#94a3b8">Aggregate GPU memory to serve a 2.8T-parameter MoE vs common deployment tiers. Further right = more memory.</text>

  <!-- requirement band: ~594 GB (community sub-4-bit quant) to ~1.4 TB (native MXFP4) -->
  <rect x="440.2" y="90" width="312.3" height="260" fill="#0d9488" fill-opacity="0.12"/>
  <line x1="440.2" y1="90" x2="440.2" y2="350" stroke="#0d9488" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="752.5" y1="90" x2="752.5" y2="350" stroke="#0d9488" stroke-width="1.6"/>
  <text x="440.2" y="84" font-size="10.5" fill="#0d9488" text-anchor="middle">~594 GB community quant</text>
  <text x="752.5" y="84" font-size="10.5" font-weight="700" fill="#0d9488" text-anchor="middle">native MXFP4 ≈ 1.4 TB</text>

  <!-- x gridlines / ticks: 0,400,800,1200,1600 GB -> x 210,365,520,675,830 -->
  <line x1="365" y1="90" x2="365" y2="350" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="520" y1="90" x2="520" y2="350" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="675" y1="90" x2="675" y2="350" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="210" y1="350" x2="830" y2="350" stroke="#94a3b8" stroke-width="1"/>
  <text x="210" y="368" font-size="10.5" fill="#94a3b8" text-anchor="middle">0</text>
  <text x="365" y="368" font-size="10.5" fill="#94a3b8" text-anchor="middle">400</text>
  <text x="520" y="368" font-size="10.5" fill="#94a3b8" text-anchor="middle">800</text>
  <text x="675" y="368" font-size="10.5" fill="#94a3b8" text-anchor="middle">1200</text>
  <text x="830" y="368" font-size="10.5" fill="#94a3b8" text-anchor="middle">1600</text>
  <text x="520" y="390" font-size="11" fill="#94a3b8" text-anchor="middle">Aggregate GPU memory (GB)</text>

  <!-- Row 1: single H100 (80 GB) -> x 241 -->
  <text x="200" y="139" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">1× H100</text>
  <text x="200" y="152" font-size="9.5" fill="#94a3b8" text-anchor="end">80 GB</text>
  <rect x="210" y="120" width="31" height="30" rx="2" fill="#dc2626"/>
  <text x="250" y="140" font-size="11" font-weight="600" fill="#dc2626" text-anchor="start">cannot load the weights at all</text>

  <!-- Row 2: 8-GPU node (640 GB) -> x 458 -->
  <text x="200" y="209" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">8-GPU node</text>
  <text x="200" y="222" font-size="9.5" fill="#94a3b8" text-anchor="end">640 GB</text>
  <rect x="210" y="190" width="248" height="30" rx="2" fill="#b45309"/>
  <text x="467" y="205" font-size="11" font-weight="600" fill="#b45309" text-anchor="start">fits a sub-4-bit community quant —</text>
  <text x="467" y="219" font-size="11" font-weight="600" fill="#b45309" text-anchor="start">no room for the native model + KV cache</text>

  <!-- Row 3: multi-node 64+ GPU (1.4 TB+) -> x 752.5, arrow beyond -->
  <text x="200" y="279" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">Multi-node</text>
  <text x="200" y="292" font-size="9.5" fill="#94a3b8" text-anchor="end">64+ GPUs</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="210" y="260" width="542.5" height="30" rx="2" fill="#2563eb"/>
  <line x1="752.5" y1="275" x2="815" y2="275" stroke="#2563eb" stroke-width="3" marker-end="url(#ar)"/>
  <text x="222" y="279" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">1.4 TB+ — the only tier that actually serves it in production</text>

  <!-- legend -->
  <rect x="210" y="404" width="12" height="12" rx="2" fill="#0d9488" fill-opacity="0.25" stroke="#0d9488" stroke-width="1"/>
  <text x="228" y="414" font-size="10.5" fill="#94a3b8" text-anchor="start">Kimi K3 memory requirement band (community quant → native MXFP4)</text>
  <text x="620" y="414" font-size="10" fill="#94a3b8" text-anchor="start">Bars = aggregate GPU memory available at each tier.</text>
</svg>
