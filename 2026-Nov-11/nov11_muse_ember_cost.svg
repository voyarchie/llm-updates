<title id="t">Muse Ember: same Intelligence Index score as Claude Haiku 5.5 at about a third of the cost per task</title>
<desc id="d">Horizontal bars of estimated US dollars per Artificial Analysis Intelligence Index task, with each model's index score. Muse Ember at xhigh effort: score 34, $0.12. Muse Ember at max effort: score 36, $0.14. Claude Haiku 5.5 at max effort: score 36, $0.41. Muse Spark 1.3: score 37, $2.39. Source: Artificial Analysis via coverage, Nov 9-10 2026.</desc>
