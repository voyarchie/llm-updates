<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Claude Haiku 5.5 against small-model rivals</title>
  <desc id="desc">Two horizontal bar charts on a common 0 to 80 scale. Panel 1, Artificial Analysis Intelligence Index v4.3, independent: Claude Sonnet 5.5 max 56 as a reference, Kimi K3 44, Claude Haiku 5.5 max 43, GLM-5.3-Flash 42, Gemini 3.8 Flash 41, GPT-6 Luna max 38. Panel 2, Terminal-Bench 4.0 percent of tasks solved, from Anthropic's launch table: Claude Sonnet 5.5 70.6, Claude Haiku 5.5 39.2, GPT-6 Luna 16.4, Claude Haiku 4.5 0. Footer: Haiku 5.5 costs 0.10 dollars input and 0.50 dollars output per million tokens for prompts up to 100 thousand tokens, versus 1 and 5 dollars for Haiku 4.5; Index score by effort level is 29 low, 34 medium, 38 high, 41 xhigh, 43 max; at max effort it uses about 162 thousand output tokens per Index task, about three times GPT-6 Luna's 50 thousand.</desc>
  <style>
    .hd{fill:#64748b;font-size:20px;font-weight:700}
    .sub{fill:#7c8aa0;font-size:12px}
    .ph{fill:#708098;font-size:14px;font-weight:700}
    .lb{fill:#708098;font-size:12.5px;font-weight:700}
    .val{fill:#708098;font-size:12.5px;font-weight:700}
    .tx{fill:#7c8aa0;font-size:11.5px}
    .ax{stroke:#94a3b8;stroke-opacity:0.5;stroke-width:1}
    .ft{fill:#708098;font-size:12.5px;font-weight:700}
    .fs{fill:#7c8aa0;font-size:11.5px}
  </style>
  <text x="30" y="36" class="hd">Claude Haiku 5.5: top of the small-model class at a tenth of the price</text>
  <text x="30" y="57" class="sub">Common 0–80 scale. Amber = new Oct 7 · green = Chinese open weights · blue = Google · teal = OpenAI · grey = Anthropic references.</text>
  <text x="30" y="96" class="ph">1 · Artificial Analysis Intelligence Index v4.3 (independent) — small-model class</text>
