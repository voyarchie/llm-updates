  <line x1="30" y1="500" x2="910" y2="500" class="ax"/>
  <text x="30" y="524" class="ft">Price per 1M tokens, prompts ≤100K: Haiku 5.5 $0.10 in / $0.50 out · Haiku 4.5 was $1 / $5 · above 100K: $0.50 / $2.50</text>
  <text x="30" y="546" class="fs">Haiku 5.5 Index score by effort: low 29 · medium 34 · high 38 · xhigh 41 · max 43. Context 1M tokens, 128K max output.</text>
  <text x="30" y="566" class="fs">Token-hungry at max effort: ~162K output tokens per Index task, ~3× GPT-6 Luna (~50K); Artificial Analysis puts it at ~$0.21 per task.</text>
  <text x="30" y="586" class="fs">Sources: Artificial Analysis and Anthropic launch table, read via search index (direct fetches were blocked); VentureBeat; MarkTechPost.</text>
